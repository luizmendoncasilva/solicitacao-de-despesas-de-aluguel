<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>Laboratório · despesa de aluguel · Cockpit</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .lx-head { margin-bottom: 22px; }
  .lx-title { font-size: 24px; font-weight: 700; color: var(--text-primary); line-height: 1.1; }
  .lx-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-top: 8px; max-width: 720px; }

  .lx-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

  .lx-secao + .lx-secao { margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--border); }
  .lx-secao-titulo { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-tertiary); margin: 0; }
  .lx-secao-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; margin: 6px 0 14px; max-width: 680px; }
  .lx-card { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border); border-radius: 14px; background: #fff; padding: 18px 20px; text-decoration: none; transition: border-color .12s, box-shadow .12s; }
  .lx-card:hover { border-color: var(--brand-blue); box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
  .lx-card-titulo { font-size: 15px; font-weight: 700; color: var(--text-primary); }
  .lx-card-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
  .lx-card-pe { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); border-top: 1px solid var(--border); padding-top: 12px; margin-top: 2px; }
  .lx-card-pe i { margin-left: auto; color: var(--brand-blue); }
  .lx-chip-id { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-tertiary); }

  .lx-porta { display: inline-flex; align-items: center; gap: 7px; margin-top: 18px; font-size: 12.5px; color: var(--brand-blue); text-decoration: none; }
  .lx-porta:hover { text-decoration: underline; }
  .lab-flag { position: fixed; left: 12px; bottom: 12px; z-index: 200; background: #141414; color: #fff; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 10px; border-radius: 6px; opacity: 0.85; }
</style>
</head>
<body>
<script>
/* Stub de FLOW_CONFIG — o núcleo monta o shell (sidebar/topbar) e os tokens. */
window.FLOW_CONFIG = {
  TYPE_METADATA: {}, EXEC_STEPS: 'geral', FORM_TABS_BY_TYPE: {},
  getInitialState() { return { queue: [], stationed: [], completed: [], messages: {}, notifications: [] }; },
};
</script>
<script src="../dp-wizard.js"></script>
<script src="../cockpit-core.js"></script>
<script src="tarefas.js"></script>
<!-- Os casos de aluguel nascem no dados.js do lab: sem ele o índice não os enxerga. -->
<script src="dados.js"></script>
<script>
/* ============================================================
   DESPESA DE ALUGUEL — a porta do lab
   ------------------------------------------------------------------------------
   Um caso só, que é o roteiro: começa na fila do operador, onde a pendência está
   sem dono, e o caminho inteiro se faz de dentro da tela — atribuir, preencher, enviar.
   ============================================================ */

const LAB_SECOES = [
  {
    titulo: 'Roteiro',
    desc: 'A pendência que o Motor Fiscal SN abre no passo 1 da Apuração de IRRF sobre Aluguel.',
    pasta: 'v1-despesa-aluguel',
    entradas: [
      {
        id: 'T-5502',
        href: 'fila.html',
        titulo: 'Fila do operador · a pendência sem dono',
        desc: 'Comece pela fila da Daniele: a pendência está na Fila geral. Abra, atribua a você, preencha, troque a residência do locador, tente enviar com campo faltando — e envie pra ver a tarefa concluir.',
      },
    ],
  },
  {
    titulo: 'V2 · múltiplos locadores',
    desc: 'A mesma pendência, agora com mais de um locador na mesma despesa: cada um tem o seu cartão (dados, pagamento e deduções) e os anexos são da despesa.',
    pasta: 'v2-multiplos-locadores',
    entradas: [
      {
        id: 'T-5502',
        href: 'fila.html?v=v2-multiplos-locadores',
        titulo: 'Fila do operador · vários locadores',
        desc: 'Mesmo roteiro da V1. No formulário, use "Adicionar outro locador", preencha cada cartão (um pode ser não residente), remova um cartão e tente enviar com campo faltando.',
      },
    ],
  },
];

function lxTarefa(id) { return AC_TAREFAS.find((t) => t.id === id) || null; }

function lxMount() {
  const host = document.getElementById('screens-container');
  if (!host) { setTimeout(lxMount, 40); return; }

  const secoes = LAB_SECOES.map((sec) => {
    const cartoes = sec.entradas.map((e) => {
      const t = lxTarefa(e.id);
      if (!t) return '';
      return `<a class="lx-card" href="${e.href || `${sec.pasta}/tarefa.html?id=${encodeURIComponent(e.id)}`}">
        <div class="lx-card-titulo">${esc(e.titulo)}</div>
        <div class="lx-card-desc">${esc(e.desc)}</div>
        <div class="lx-card-pe">
          <span class="lx-chip-id">${esc(t.id)}</span>
          <span>${esc(t.clientName)} · competência ${esc(t.competencia)}</span>
          <i data-lucide="arrow-right" style="width:15px;height:15px;"></i>
        </div>
      </a>`;
    }).join('');
    return `<section class="lx-secao">
      <h2 class="lx-secao-titulo">${esc(sec.titulo)}</h2>
      <p class="lx-secao-desc">${esc(sec.desc)}</p>
      <div class="lx-cards">${cartoes}</div>
    </section>`;
  }).join('');

  host.innerHTML = `<div class="container-wide" style="min-width:840px;">
    <div class="flex items-center gap-3" style="font-size:12px;color:var(--text-secondary);margin-bottom:16px;">
      <a href="../index.html" style="color:inherit;text-decoration:none;" class="cursor-pointer hover:text-rose-500">← Porta de entrada</a>
    </div>
    <div class="lx-head">
      <div class="lx-title">Despesa de aluguel</div>
      <div class="lx-sub">O Motor Fiscal SN apura o IRRF sobre o aluguel que a empresa paga a locador pessoa física. No passo 1 ele precisa de uma pessoa: cai na fila uma pendência com o formulário, e o motor segue sozinho depois do envio.</div>
    </div>
    ${secoes}
    <a class="lx-porta" href="painel.html?v=v1-despesa-aluguel"><i data-lucide="list" style="width:14px;height:14px;"></i>Entrar pela tela de acompanhamento</a>
  </div>`;

  document.body.insertAdjacentHTML('beforeend', '<div class="lab-flag">laboratório · despesa de aluguel</div>');
  refreshIcons();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', lxMount); else lxMount();
</script>
</body>
</html>
