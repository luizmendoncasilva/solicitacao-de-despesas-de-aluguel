<!-- O formulário da Despesa de aluguel. Mora na raiz do lab: é o mesmo nas versões. -->
<script src="../aluguel.js"></script>
<script>
/* ============================================================
   LABORATÓRIO — v1 DESPESA DE ALUGUEL · a tela da tarefa em tela cheia
   ------------------------------------------------------------------------------
   ESTA PASTA É UMA VERSÃO. O chassi mora aqui e nenhuma versão importa o chassi
   de outra — pra criar uma v2, copie a pasta inteira e mexa à vontade.
   Compartilhado na raiz do lab: o dado (../dados.js, ../tarefas.js) e
   ../aluguel.js, o formulário que a pendência de aluguel mostra no miolo.
   Nada aqui toca o protótipo publicado: o painel de entrada é ../painel.html,
   uma cópia que vive dentro do lab. Índice das versões: ../index.html
   ------------------------------------------------------------------------------
   Regras que esta versão materializa:
   1. Ver É entrar: a linha do painel abre esta tela, não um modal.
   2. Leitura é aberta; AÇÃO depende de posse. Não é sua → controles desativados
      e um caminho só: "Atribuir a mim".
   3. Linha de execução = ROTEIRO FIXO (os passos que faltam aparecem cinza),
      igual pro DP e pro Autopilot.
   4. Rastro de tentativas vive DENTRO do passo, no "Histórico" — que é também
      onde se comenta (um affordance por passo).
   5. As fases no topo são LEITURA. "Voltar aos dados da solicitação" é ação com confirmação.
   6. Conversa com o cliente = painel lateral (não existe em tarefa do robô).
   7. A tela ABRE NA ETAPA em que a tarefa está: em Dados da solicitação mostra os dados
      a conferir (os mesmos blocos do fluxo de DP), em Processamento mostra o roteiro.
   ============================================================ */

// Identidade desta versão: o nome da pasta. Alimenta o "voltar" (que devolve ao
// painel na mesma versão) e o selo do canto. Numa cópia, é a primeira linha a mudar.
const LAB_VERSAO = 'v1-despesa-aluguel';
const LAB_VERSAO_LABEL = 'v1 · despesa de aluguel';

const LAB_EU = 'o1'; // eu = Daniele Ribeiro (o mesmo OPERATOR_NAME do núcleo)
const LAB_FASES_ROBO = ['Execução iniciada', 'Processamento', 'Concluída'];
const LAB_FASES_DP = ['Solicitação recebida', 'Dados da solicitação', 'Processamento', 'Concluída'];

// aberto: quais passos estão com o bloco de eventos expandido · rascunho: o que já foi
// digitado em cada campo de comentário (a tela re-renderiza a cada ação, não pode perder o
// texto) · anexos: os arquivos já escolhidos naquele campo, pela mesma chave do rascunho.
// lancAberto: qual campo de comentário de EVENTO está aberto ('passo.evento').
// espera: a opção "colocar em espera" do rodapé da Conversa vem marcada (pedir algo ao
// cliente é o motivo mais comum de escrever pra ele); quem só quer avisar desmarca.
// vendo: índice da fase que estou OLHANDO no stepper (null = a fase corrente da tarefa).
// acoes: qual ação externa de passo já foi acionada ("Baixar TXT" → "Baixado").
// expandido: qual passo FEITO está com o corpo aberto (passo feito recolhe, como no projeto).
// drawerQual: qual painel está aberto ('conversa' | 'historico' | 'eventos') — a chegada de
// mensagem precisa saber se o operador já está de olho na conversa, e o painel de eventos
// precisa se redesenhar quando alguém comenta. evPasso: de qual passo são os eventos abertos.
// msgIdx: qual mensagem do pool o gatilho do sino vai usar na próxima vez.
const _lab = { t: null, lancAberto: {}, rascunho: {}, anexos: {}, expandido: {}, drawer: false, drawerQual: null, evPasso: null, espera: true, vendo: null, msgIdx: 0 };

/* ---------- a tarefa ---------- */
function labId() { return new URLSearchParams(location.search).get('id') || ''; }
// Quem chegou pela fila do operador volta pra ela; o resto volta ao painel da versão.
function labVoltarHref() {
  return new URLSearchParams(location.search).get('de') === 'fila' ? '../fila.html' : '../painel.html?v=' + LAB_VERSAO;
}

// Três tipos (mapa de unificacao-acompanhamento.md): cliente/Hub · HITL (robô→pessoa) · robô.
function labTipo(t) {
  if (t.operatorId === 'ap') return 'robo';
  if (t.origin === 'autopilot') return 'hitl';
  return 'cliente';
}
// Posse decide o que a pessoa PODE FAZER — nunca o que ela pode ler.
function labPosse(t) {
  if (t.status === 'completed' || t.status === 'cancelled') return 'encerrada';
  if (t.operatorId === 'ap') return 'robo';
  if (t.operatorId === LAB_EU) return 'minha';
  if (t.operatorId) return 'outro';
  return 'ninguem';
}
function labEhAutopilot(t) { return labTipo(t) !== 'cliente'; }

/* ---------- MODO LEITURA ---------- */
function labPodeAgir(t) { return labPosse(t) === 'minha'; }

/* ---------- os dados da solicitação no formato do projeto ----------
   Os mocks do lab trazem `secoes: [{ titulo, subsecoes: [{ titulo, campos }] }]`. O projeto
   trabalha com `formData.abas: { aba: { secao: { campo: valor } } }` — é o que `renderForm`,
   `enterEditMode` e `saveEdits` leem e escrevem. A conversão abaixo é só de FORMA: mesma
   informação, mesma ordem, nada inventado. Os títulos viram as chaves de propósito — é o que
   faz o "Ver alterações" do núcleo sair legível ("1. Geral · Dados básicos") sem dicionário.
   Registrar em FORM_TABS_BY_TYPE é o que dá as abas ao `renderForm` e ao `renderFormReference`. */
function labFormData(t) {
  if (t.formData) return t.formData;
  const secoes = _tsmSecoes(t) || [];
  const abas = {};
  secoes.forEach((s) => {
    const conteudo = {};
    if (Array.isArray(s.subsecoes)) s.subsecoes.forEach((ss) => { conteudo[ss.titulo || ''] = Object.assign({}, ss.campos); });
    else conteudo[''] = Object.assign({}, s.campos || {});
    abas[s.titulo] = conteudo;
  });
  t.formData = { abas };
  const colab = labColaborador(t, abas);
  if (colab) t.formData.colaborador = colab;
  FLOW_CONFIG.FORM_TABS_BY_TYPE[t.typeCode] = secoes.map((s) => ({ id: s.titulo, label: s.titulo }));
  return t.formData;
}
/* A faixa do colaborador (avatar + CPF + código) que a tela real mostra no alto dos dados. O mock
   guarda só o nome em `t.colaborador`; CPF e matrícula estão soltos dentro dos campos, então são
   PESCADOS de lá em vez de inventados. Sem nome, sem faixa — é o que o núcleo já faz. */
function labColaborador(t, abas) {
  if (!t.colaborador || typeof t.colaborador !== 'string') return null;
  const buscar = (nomes) => {
    for (const secs of Object.values(abas)) {
      for (const campos of Object.values(secs)) {
        for (const chave of nomes) if (campos && campos[chave]) return campos[chave];
      }
    }
    return '';
  };
  return { nome: t.colaborador, cpf: buscar(['CPF']) || '—', codigo: buscar(['Matrícula', 'Código']) || '—' };
}
// O log de alterações que o mock já trazia (`t.log`) passa a viver onde o núcleo o procura, pra
// que o "Ver alterações" mostre o que veio do mock E o que for editado agora na mesma lista.
// Aba/seção não estão no mock: são descobertas procurando o campo nas seções.
function labSemearLog(t) {
  if (!state._editLog) state._editLog = {};
  if (state._editLog[t.id]) return;
  const abas = labFormData(t).abas;
  const achar = (campo) => {
    for (const [tab, secs] of Object.entries(abas)) {
      for (const [sec, cs] of Object.entries(secs)) if (cs && campo in cs) return { tab, sec };
    }
    return { tab: Object.keys(abas)[0] || '', sec: '' };
  };
  state._editLog[t.id] = (t.log || []).map((e) => {
    const onde = achar(e.field);
    return { tabId: onde.tab, section: onde.sec, field: e.field, before: e.before, after: e.after, changedBy: e.by || OPERATOR_NAME, changedAt: e.at || '' };
  });
}

/* ---------- fases (topo, leitura) ---------- */
function labFases(t) {
  const tipo = labTipo(t);
  const done = (label) => ({ label, meta: 'Concluído', state: 'done' });
  const pend = (label) => ({ label, meta: 'Aguardando', state: 'pending' });
  const act = (label, meta) => ({ label, meta: meta || 'Em andamento', state: 'active' });
  const warn = (label, meta) => ({ label, meta: meta || 'Travou', state: 'warn' });
  const encerrada = t.status === 'completed';

  if (tipo === 'robo') {
    const L = LAB_FASES_ROBO;
    if (encerrada) return L.map(done);
    if (t.apHitl) return [done(L[0]), warn(L[1]), pend(L[2])];
    return [done(L[0]), act(L[1]), pend(L[2])];
  }
  const L = LAB_FASES_DP;
  if (encerrada) return L.map(done);
  if (t.status === 'queue') return [done(L[0]), pend(L[1]), pend(L[2]), pend(L[3])];

  const idx = (t.status === 'processing' || t.timelineStep === 2) ? 2 : 1;
  const esperando = t.status === 'stationed' && !t.clientResponded;
  return L.map((label, k) => {
    if (k < idx) return done(label);
    if (k > idx) return pend(label);
    return esperando ? act(label, 'Aguardando cliente') : act(label);
  });
}
// Em espera aguardando o cliente (o relógio parado), em qualquer fase.
function labEmEspera(t) { return t.status === 'stationed' && !t.clientResponded; }
function labFaseAtual(t) {
  if (t.status === 'cancelled') return 'Cancelada';
  const fs = labFases(t);
  const atual = fs.find((f) => f.state === 'active' || f.state === 'warn');
  if (atual) return atual.label;
  // Sem fase em andamento (tarefa na fila, ou já encerrada): a fase corrente é a
  // última concluída — nunca a última da régua.
  const feitas = fs.filter((f) => f.state === 'done');
  return feitas.length ? feitas[feitas.length - 1].label : fs[0].label;
}
function labNoProcessamento(t) { return labFaseAtual(t) === 'Processamento'; }
/* Os rótulos da régua DO TIPO da tarefa. Cada mundo tem a sua: o robô tem três fases, o HITL e o
   DP têm quatro, e os nomes não coincidem ("Execução iniciada" ≠ "Solicitação recebida"). */
function labFasesLabels(t) {
  const tipo = labTipo(t);
  if (tipo === 'robo') return LAB_FASES_ROBO;
  return LAB_FASES_DP;
}
function labFaseIdx(t) { return labFasesLabels(t).indexOf(labFaseAtual(t)); }
/* ---------- NAVEGAR PELO STEPPER SEM MUDAR STATUS ---------- */
function labFaseVista(t) {
  const cur = labFaseIdx(t);
  if (_lab.vendo === null || _lab.vendo === undefined) return cur;
  return Math.min(_lab.vendo, cur);
}
function labVisitando(t) { return labFaseVista(t) !== labFaseIdx(t); }
function labStepperNavegavel(t) { return t.status !== 'cancelled' && labFaseIdx(t) >= 1; }
function labFaseClicavel(t, i) {
  const fases = labFases(t);
  const cur = labFaseIdx(t);
  if (!labStepperNavegavel(t) || i > cur) return false;
  if (i === 0 || i === fases.length - 1) return false;
  return true;
}
function labIrParaFase(i) {
  const t = _lab.t;
  if (!labFaseClicavel(t, i)) return;
  _lab.vendo = (i === labFaseIdx(t)) ? null : i;
  // O roteiro sai da tela: um painel de eventos aberto fala de um passo que não está mais aqui.
  if (_lab.drawerQual === 'eventos') labDrawerFechar();
  labRender();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function labStepperHTML(t) {
  const fases = labFases(t);
  const cur = labFaseIdx(t);
  const vista = labFaseVista(t);
  const ult = fases.length - 1;
  const dotCls = { done: 'tl-dot-done', active: 'tl-dot-active', warn: 'tl-dot-warn', pending: 'tl-dot-pending' };
  return fases.map((s, i) => {
    const podeIr = labFaseClicavel(t, i);
    const olhando = i === vista && vista !== cur;
    const click = podeIr ? ` onclick="labIrParaFase(${i})" title="Ver os dados desta etapa — não muda o status da tarefa"` : '';

    if (i === 0 || i === ult) {
      // Data/hora vem dos campos que a tarefa já guarda — os mesmos do header.
      const quando = i === 0 ? solicitadoEmLabel(t) : (s.state === 'done' ? concluidoEmLabel(t) : '');
      const cls = `tl-item-h lab-tl-marco ${s.state}`;
      const feito = i === 0 || s.state === 'done';
      return `<div class="${cls}"><div class="tl-marco-dot${feito ? ' feito' : ''}"></div><div class="tl-marco-label">${esc(s.label)}</div>${quando ? `<div class="tl-marco-when">${esc(quando)}</div>` : ''}</div>`;
    }

    const dot = s.state === 'done' ? '<i data-lucide="check" class="w-3 h-3"></i>' : String(i);
    // O item ANTES da ponta final encurta a própria linha: ela é calculada pro dot de 28px e
    // sobraria um vão de 18px até a bolinha pequena.
    const antesDoFim = i === ult - 1 ? ' lab-tl-antes-marco' : '';
    const cls = `tl-item-h ${s.state}${antesDoFim}${podeIr ? ' lab-tl-nav' : ''}${olhando ? ' lab-tl-olhando' : ''}`;
    return `<div class="${cls}"${click}><div class="tl-dot ${dotCls[s.state] || 'tl-dot-pending'}">${dot}</div><div class="tl-step">${esc(s.label)}</div><div class="tl-meta">${esc(olhando ? 'Você está aqui' : (s.meta || ''))}</div></div>`;
  }).join('');
}

// Recebida (na fila) e Dados da solicitação abrem no MESMO miolo: o que se faz nas duas
// é conferir os dados que o cliente mandou. A diferença é só quem pode agir (posse).
function labEmValidacao(t) { const i = labFaseVista(t); return i === 0 || i === 1; }

/* ---------- roteiro (a linha de execução) ----------
   Um renderizador só. O que muda entre os mundos é de onde vêm os passos:
   Autopilot → AP_FLUXOS (dp-wizard.js) · DP/Hub → EXEC_STEP_PRESETS do núcleo,
   via labPassosDoProcesso (../dados.js). Os passos NÃO são inventados aqui. */
function labRoteiro(t) {
  const tipo = labTipo(t);
  if (tipo === 'robo') return labRoteiroRobo(t);
  if (tipo === 'hitl') return labRoteiroHITL(t);
  return labRoteiroDP(t);
}

function labRoteiroRobo(t) {
  const etapas = AP_FLUXOS[t.apFluxo] || [];
  if (!etapas.length) return [];
  const total = etapas.length;
  const done = Math.min(t.apDone || 0, total);
  const ehRobo = labTipo(t) === 'robo';
  // Atuações de operador no meio (compat com apOperador, igual ao apBuildMiolo)
  let atuacoes = t.apAtuacoes ? t.apAtuacoes.slice() : [];
  if (!atuacoes.length && t.apOperador) atuacoes = [Object.assign({ naEtapa: done - 1 }, t.apOperador)];
  const crosslink = (ehRobo ? t.apPendencia : t.apExecucao) || null;

  // Roteiro COMPLETO, inclusive na pendência HITL: quem está resolvendo precisa ver o que
  // vem depois de destravar. Isso substitui a truncagem da regra 2 de
  // unificacao-acompanhamento.md (que existia pra HITL não parecer "tarefa do robô" — o
  // cabeçalho já diz de quem é a tarefa, então o corte custava mais do que resolvia).
  const out = [];
  for (let i = 0; i < total; i++) {
    const e = etapas[i];
    const atu = atuacoes.find((a) => a.naEtapa === i);
    // O 3º campo de AP_FLUXOS é o RESULTADO do passo — só existe depois de rodar.
    // Passo aguardando ou travado não anuncia resultado nenhum.
    const resultado = (e[2] && e[2] !== '—') ? e[2] : '';
    const passo = {
      n: i + 1, grupo: e[0], nome: e[1], desc: '',
      quando: i < done ? _apTime(i) : '', hist: [], coment: [], blocos: [], state: 'pending',
    };
    if (i < done) { passo.state = 'done'; passo.desc = resultado; }
    else if (i === done && t.apHitl) {
      passo.state = 'failed';
      passo.quando = _apTime(i); // falhou também tem hora: é o momento em que travou
      passo.falha = { texto: t.apHitl.det || '', comparativo: t.apHitl.comparativo || null, link: crosslink, need: t.apHitl.need || '' };
    } else if (i === done && t.apRun) passo.state = 'active';

    // Registros e comentários: quando a tarefa DECLARA o log (labHist/labComent — o caso
    // trazido da versão em modal), é ele que vale. Sem declaração, deriva das atuações.
    if (t.labHist || t.labComent) {
      passo.hist = ((t.labHist || {})[i] || []).slice();
      passo.coment = ((t.labComent || {})[i] || []).slice();
    } else {
      if (atu && atu.divergencia) {
        passo.hist.push({ tipo: 'erro', quando: _apTime(i), texto: atu.divergencia, comparativo: atu.comparativo || null, link: (!ehRobo && crosslink) ? crosslink : null });
        if (passo.state === 'done') passo.hist.push({ tipo: 'ok', quando: _apTime(i), texto: '' });
      }
      // A atuação humana entra como COMENTÁRIO do passo (não como registro do robô).
      if (atu && (atu.resposta || atu.obs)) {
        passo.coment.push({
          autor: atu.nome || 'Operador', quando: _apTime(i),
          texto: (atu.resposta ? ('Teve que corrigir alguma coisa? ' + (atu.resposta === 'sim' ? 'Sim' : 'Não, estava tudo certo') + (atu.obs ? ' — ' : '')) : '') + (atu.obs || ''),
          anexos: atu.anexos || [],
        });
      }
    }
    // Se o passo rodou de novo, a linha de cima mostra o resultado da ÚLTIMA execução —
    // senão o resumo contradiz o registro que está lá dentro (ex.: líquido da versão 1
    // no título e da versão 2 no registro).
    const ultimoOk = passo.hist.filter((h) => h.tipo === 'ok' && h.texto).pop();
    if (ultimoOk && passo.state === 'done') { passo.desc = ultimoOk.texto; passo.quando = ultimoOk.quando || passo.quando; }
    // Passo que rodou pode declarar seu horário e seus blocos (arquivos, destino). Só depois de
    // rodar: passo aguardando não tem hora nem material.
    if (passo.state !== 'pending') {
      if (t.labQuando && t.labQuando[i]) passo.quando = t.labQuando[i];
      if (t.labBlocos && t.labBlocos[i]) passo.blocos.push(...t.labBlocos[i]);
    }
    out.push(passo);
  }
  return out;
}

function labHoraPasso(t, i) {
  const m = /(\d{1,2}):(\d{2})/.exec(t.receivedAt || '');
  const base = (m ? Number(m[1]) * 60 + Number(m[2]) : 540) + 25 + i * 6;
  const dia = _dmyFromDaysAgo(t.createdDaysAgo).slice(0, 5);
  return `${dia} · ${_pad2(Math.floor(base / 60) % 24)}:${_pad2(base % 60)}`;
}

const LAB_V1_PASSO_FINAL = {
  nome: 'Mensagem e entrega ao cliente',
  desc: '',
};

function labPassosDP(t) {
  return labPassosDoProcesso(t.typeCode).map((p) => (p.tipo === 'final-message'
    ? Object.assign({}, p, LAB_V1_PASSO_FINAL)
    : p));
}

function labRoteiroDP(t) {
  // Passos = os MESMOS das telas de fluxo (EXEC_STEP_PRESETS do núcleo), via dados.js.
  // Exceção declarada acima: o passo final de DP tem nome e descrição próprios nesta versão.
  const passos = labPassosDP(t);
  const done = t.labDone || 0;
  const falha = t.labFalha || null;
  const rodando = labNoProcessamento(t);

  /* EVENTOS E COMENTÁRIOS DO PASSO — indexados pela posição no roteiro RENDERIZADO, que é o `i`
     que os botões de comentar usam. O robô e o HITL já leem `labHist`/`labComent` assim; o DP não
     lia, e o efeito era um comentário que se gravava e desaparecia no redesenho seguinte (a
     contagem no cabeçalho também nunca subia). Bug antigo, que só ficou visível depois de 04/08 —
     antes os passos de DP não tinham evento nenhum pra pendurar comentário. */
  const doPasso = (idx) => ({
    hist: ((t.labHist || {})[idx] || []).slice(),
    coment: ((t.labComent || {})[idx] || []).slice(),
  });

  const out = [Object.assign({
    n: 1, grupo: '', nome: 'Dados da solicitação',
    desc: 'Dados conferidos pelo operador e liberados para processamento.',
    quando: labHoraPasso(t, 0), state: 'done', blocos: [],
  }, doPasso(0))];

  passos.forEach((p, k) => {
    let state = 'pending';
    if (k < done) state = 'done';
    else if (falha && falha.naEtapa === k) state = 'failed';
    else if (k === done && rodando) state = 'active';
    const blocos = [];
    // Tudo o que fala da falha vai DENTRO do evento de falha — causa, dados e o que precisa ser
    // feito (ver labRoteiroRobo).
    let dadosFalha = null;
    if (state === 'failed' && falha) {
      dadosFalha = { texto: falha.texto, comparativo: falha.comparativo || null, link: null, need: falha.need || '' };
    }
    if (p.ref) blocos.push({ tipo: 'dados-solicitacao', opts: { primeiroAberto: p.refAberto } });
    if (p.painelId) blocos.push({ tipo: 'painel-gestta' });
    if (p.tipo === 'final-message') blocos.push({ tipo: 'mensagem-final', feito: state === 'done' });
    // Passo que ainda não rodou não tem hora — mesma regra do robô: aguardando não anuncia nada.
    out.push(Object.assign({
      n: k + 2, grupo: '', nome: p.nome, desc: p.desc, state, blocos, falha: dadosFalha,
      quando: (state === 'done' || state === 'failed') ? labHoraPasso(t, k + 1) : '',
      passoIdx: k, acao: p.acao, autoConclui: p.autoConclui,
    }, doPasso(k + 1)));
  });
  return out;
}

/* ---------- miolo do HITL ---------- */
function labMioloHITL(t) {
  const fase = labFaseVista(t);
  if (fase >= 2) return labExecucao(t);
  return labAtuacaoHITL(t);
}

// A última atuação do operador — é ela que a tarefa HITL registra como "o que foi feito".
function labUltimaAtuacao(t) {
  const lista = (t.apAtuacoes && t.apAtuacoes.length) ? t.apAtuacoes : (t.apOperador ? [t.apOperador] : []);
  return lista.length ? lista[lista.length - 1] : null;
}

function labHoraRecebida(t) {
  const dia = _dmyFromDaysAgo(t.createdDaysAgo).slice(0, 5);
  return t.receivedAt ? `${dia} · ${t.receivedAt}` : dia;
}

function labFalhaHITL(t) {
  const m = (typeof apBuildMiolo === 'function') ? apBuildMiolo(t) : null;
  if (m && m.problem) return { head: m.problem.head, texto: m.problem.text || '', detalheHTML: m.problem.detailHTML || '' };
  const etapas = [];
  ((m && m.grupos) || []).forEach((g) => (g.segmentos || []).forEach((s) => (s.etapas || []).forEach((e) => etapas.push(e))));
  const an = etapas.filter((e) => e.anomalia).pop();
  if (an) return { head: an.nome, texto: an.det || '', comparativo: an.comparativo || null, link: an.link || t.apExecucao || null };
  // Sem miolo montável: o que a tarefa declarar. O título dela é o último recurso pro nome.
  const h = t.apHitl || t.labHitlOrigem || null;
  const atu = labUltimaAtuacao(t);
  const texto = (h && h.det) || (atu && atu.divergencia) || '';
  if (!texto) return null;
  return { head: t.type || 'Falhou', texto, comparativo: (h && h.comparativo) || (atu && atu.comparativo) || null, link: t.apExecucao || null };
}

function labRoteiroHITL(t) {
  const alu = aluEhAluguel(t);
  const atu = labUltimaAtuacao(t);
  const quando = (alu && t.aluguel.enviado) ? t.aluguel.enviado.quando : _apTime((t.apDone || 1) - 1);
  const quem = (atu && atu.nome) ? atu.nome.split(' · ')[0] : OPERATOR_NAME;
  let desc = atu
    ? `${quem} — ${atu.resposta === 'sim' ? 'corrigiu o que estava divergente' : 'conferiu e não precisou corrigir'}`
    : 'Resolvido e devolvido ao Autopilot.';
  if (alu) desc = `${quem} — preencheu os dados do aluguel`;
  // A pendência de aluguel não nasce de anomalia: não há "por que parou" pra mostrar.
  const falha = alu ? null : labFalhaHITL(t);
  const blocos = [];
  if (falha) {
    blocos.push({
      tipo: 'contexto', head: falha.head, texto: falha.texto,
      comparativo: falha.comparativo || null, link: falha.link || null,
      detalheHTML: falha.detalheHTML || '', quando: labHoraRecebida(t),
    });
  }
  if (alu) blocos.push({ tipo: 'dados-aluguel' });
  else if (atu) blocos.push({ tipo: 'atuacao', resposta: atu.resposta, obs: atu.obs, anexos: atu.anexos || [] });
  /* NASCE ABERTO. O passo feito recolhe porque, numa tarefa de DP concluída, quatro corpos
     empilhados viram um paredão — aqui existe UM passo, e recolhê-lo deixa a tela sem nada além
     do próprio título. Pior: o que está dentro é a razão de a tarefa existir. Quem abre uma
     pendência do robô precisa ler por que ela chegou até ele sem antes caçar uma seta. */
  return [{
    n: 1, grupo: '', nome: 'Atuação do operador', desc, quando, state: 'done', blocos,
    nasceAberto: true,
    hist: [{ tipo: 'ok', quando, texto: '' }],
    coment: (t.labComent && t.labComent[0]) ? t.labComent[0].slice() : [],
  }];
}

function labAtuacaoHITL(t) {
  if (aluEhAluguel(t)) return labAtuacaoAluguel(t);
  const posse = labPosse(t);
  // materiais só quando existem: as telas reais sempre passam true porque as tarefas delas
  // sempre têm anexo; estes mocks não têm, e um "Materiais (0)" vazio é ruído.
  const anexos = t.attachments || [];
  const miolo = apMiolo(apBuildMiolo(t), { materiais: anexos.length > 0, anexos });

  const visita = labVisitando(t);

  let nota = '';
  if (visita) nota = '<p style="color:var(--text-secondary);font-size:13px;margin:0 0 20px;">Você está revendo uma etapa que já passou: a anomalia e o que foi feito estão aqui, mas ela já foi resolvida e devolvida ao Autopilot.</p>';
  else if (posse === 'ninguem') nota = '<p style="color:var(--text-secondary);font-size:13px;margin:0 0 20px;">A tarefa ainda não tem dono: aqui é leitura. Para resolver a anomalia e devolver ao Autopilot, atribua a você.</p>';
  else if (posse === 'outro') nota = '<p style="color:var(--text-secondary);font-size:13px;margin:0 0 20px;">Você está lendo uma tarefa que não é sua: os controles ficam desativados.</p>';

  let resolucao = '';
  if (!visita) {
    _correcao = null;
    window._resolucaoFiles = [];
    const corpo = resolucaoHTML().replace('enviarAoRobo()', 'labEnviarAoRobo()');
    if (labPodeAgir(t)) {
      resolucao = `<div class="section-card" id="resolucao-card">${corpo}</div>`;
    } else {
      const motivo = posse === 'ninguem'
        ? 'A tarefa não tem dono — atribua a você para resolver'
        : 'Só quem está com a tarefa resolve e devolve ao Autopilot';
      resolucao = `<div class="section-card" id="resolucao-card" title="${motivo}" style="cursor:not-allowed;"><fieldset disabled style="border:none;margin:0;padding:0;opacity:0.5;">${corpo}</fieldset></div>`;
    }
  }

  return `<div class="section-card">
    <div class="section-title" style="margin-bottom:0;"><i data-lucide="file-text"></i>Dados da solicitação</div>
    ${nota}${miolo}
  </div>${resolucao}`;
}

/* A pendência de aluguel: no lugar da anomalia e da resolução, o formulário (../aluguel.js). */
function labAtuacaoAluguel(t) {
  const posse = labPosse(t);
  const visita = labVisitando(t);
  const estilo = 'color:var(--text-secondary);font-size:13px;margin:14px 0 0;';
  let nota = '';
  if (visita) nota = `<p style="${estilo}">Você está revendo uma etapa que já passou: os dados abaixo já foram enviados ao Motor Fiscal.</p>`;
  else if (posse === 'ninguem') nota = `<p style="${estilo}">A tarefa ainda não tem dono: aqui é leitura. Para preencher os dados e devolver ao Motor Fiscal, atribua a você.</p>`;
  else if (posse === 'outro') nota = `<p style="${estilo}">Você está lendo uma tarefa que não é sua: os controles ficam desativados.</p>`;
  return `<div class="section-card">
    <div class="section-title" style="margin-bottom:0;"><i data-lucide="file-text"></i>Dados da solicitação</div>
    ${nota}
    <div style="margin-top:18px;">${visita ? aluRegistroHTML(t) : aluFormHTML(t)}</div>
  </div>`;
}

/* O envio do wizard. A resposta do operador vira uma ATUAÇÃO e a anomalia morre — é o estado
   em que a T-5012 (HITL concluída) já nasce, então a tela fica coerente se você voltar nela.
   Depois de enviar, a tela vira o ROTEIRO (não mais a tela dedicada de "Reprocessando…"):
   primeiro com o fecho dizendo que o motor está reprocessando e, quando ele termina, dizendo
   que você fez sua parte. Mesma informação da tela que morreu, dentro do passo a passo. */
function labEnviarAoRobo() {
  const t = _lab.t;
  const ta = document.getElementById('wizard-descricao');
  const obs = ta ? ta.value.trim() : '';
  if (!obs) return;
  const h = t.apHitl || {};
  t.apAtuacoes = (t.apAtuacoes || []).concat([{
    naEtapa: t.apDone || 0, divergencia: h.det || '', comparativo: h.comparativo || null,
    nome: OPERATOR_NAME + ' · operadora', resposta: _correcao || 'nao', obs,
    anexos: (window._resolucaoFiles || []).slice(),
  }]);
  delete t.apOperador; // compat: se o mock usava o objeto único, a atuação agora está na lista
  t.apHitl = null;
  labDevolverAoMotor(t);
}

// A pendência volta pro motor: o passo dela conta como feito e o roteiro assume a tela.
function labDevolverAoMotor(t) {
  t.apDone = (t.apDone || 0) + 1;
  t.status = 'processing';
  labRender();
  setTimeout(() => {
    t.status = 'completed';
    t.finishedDaysAgo = 0;
    t.finishedAt = labAgora();
    labRender();
  }, 2100);
}

/* ---------- header ---------- */
function labHeader(t) {
  const tipo = labTipo(t), posse = labPosse(t);
  const encerrada = posse === 'encerrada';
  const op = acOp(t.operatorId);
  const isAP = labEhAutopilot(t);

  const bc = [`<a href="${labVoltarHref()}" style="color:inherit;text-decoration:none;" class="cursor-pointer hover:text-rose-500">← Voltar</a>`];
  bc.push(`<span>${esc(labFaseAtual(t))}</span>`);

  const tags = isAP
    ? `<span class="contact-tag">robô</span>`
    : `<span class="contact-tag contact-tag-client">cliente</span>${(t.senderScopes || []).map((s) => `<span class="contact-tag">${esc(s)}</span>`).join('')}`;

  const quando = t.status === 'completed'
    ? `Solicitado em ${esc(solicitadoEmLabel(t))} <span style="color:var(--text-tertiary);">·</span> <span style="color:var(--success);font-weight:600;">Concluído em ${esc(concluidoEmLabel(t))}</span>`
    : `Solicitado em ${esc(solicitadoEmLabel(t))}`;

  const atribuido = t.operatorId === 'ap'
    ? `Atribuído ao <strong style="color:var(--text-primary);font-weight:600;">Autopilot</strong>`
    : (op ? `Atribuído a <strong style="color:var(--text-primary);font-weight:600;">${esc(op.nome)}</strong>${posse === 'minha' ? ' <span style="color:var(--text-tertiary);">(você)</span>' : ''}`
          : `<span style="color:var(--text-tertiary);">Não atribuída ainda</span>`);

  /* Ação depende de posse — e é UMA por vez. */
  let acao = '';
  if (posse === 'minha') acao = `<button class="btn-return-queue" onclick="labDevolverFila()"><i data-lucide="corner-up-left" class="w-4 h-4"></i>Devolver à fila</button>`;
  else if (posse === 'ninguem') acao = `<button class="btn btn-primary" style="padding:7px 14px;font-size:12.5px;" onclick="labAtribuirAMim()"><i data-lucide="user-plus" class="w-4 h-4"></i>Atribuir a mim</button>`;
  else if (posse === 'outro') acao = `<button class="btn-return-queue" onclick="labDevolverFila()"><i data-lucide="corner-up-left" class="w-4 h-4"></i>Devolver à fila</button>`;

  const cancelada = t.status === 'cancelled'
    ? `<div class="stopped-card" style="margin-top:16px;"><div class="problem-head"><i data-lucide="x-circle"></i>Cancelada</div><div class="problem-text">Justificativa: ${esc(t.cancelReason || '—')}</div></div>`
    : '';

  return `<div class="section-card lab-topo" style="padding:20px 28px;">
    <div class="flex items-center gap-3" style="font-size:12px;color:var(--text-secondary);margin-bottom:20px;">
      ${bc.join('<span>/</span>')}
    </div>
    <div class="flex items-start gap-4" style="flex-wrap:wrap;">
      <div style="min-width:0;flex:1 1 340px;">
        <h1 style="font-size:22px;font-weight:700;margin:0 0 4px;">${esc(t.type || '')}</h1>
        <div style="font-size:13px;"><strong style="font-weight:600;">${esc(t.clientName || '')}</strong><span style="color:var(--text-tertiary);"> · </span><span style="color:var(--text-secondary);font-family:'JetBrains Mono',monospace;">${esc(t.cnpj || '')}</span></div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--text-tertiary);">${olMetaStripHtml(t)}</div>
      </div>
      <div class="lab-head-acoes">${labHistoricoBtn(t)}${labConversaBtn(t)}</div>
    </div>
    <div style="border-top:1px solid var(--border);margin:12px 0;"></div>
    <div style="font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;">
        <span>${isAP ? 'Iniciado pelo' : 'Solicitado por'} <strong style="color:var(--text-primary);font-weight:600;">${esc(t.senderName || '—')}</strong></span>
        <span style="display:inline-flex;gap:4px;">${tags}</span>
        <span style="color:var(--text-tertiary);">·</span>
        <span style="color:var(--text-tertiary);">${quando}</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <span>${atribuido}</span>
        ${acao}
      </div>
    </div>
    ${cancelada}
  </div>`;
}

/* ---------- BLOCOS: o conteúdo que um passo declara carregar ---------- */
function labBloco(t, bl) {
  if (!bl) return '';
  if (bl.tipo === 'contexto') {
    const link = bl.link ? `<button class="ap-crosslink" onclick="acNavModal('${bl.link.to}')"><i data-lucide="external-link" style="width:15px;height:15px;"></i>${esc(bl.link.label)}</button>` : '';
    /* `detalheHTML` vem pronto do `apBuildMiolo` (comparativo + cross-link já montados) — é o
       caminho do HITL, que lê a falha da mesma fonte que a tela de resolução. Quando ele existe,
       comparativo e link já estão lá dentro e montá-los de novo duplicaria os dois. */
    const detalhe = bl.detalheHTML ? bl.detalheHTML : `${apCmpHTML(bl.comparativo)}${link}`;
    // A hora é a do fato, no mesmo fio do título do passo: quando o motor travou.
    const quando = bl.quando ? `<span class="step-sep"></span><span class="step-when">${esc(bl.quando)}</span>` : '';
    return `<div class="stopped-card"><div class="problem-head lab-titulo-hora"><i data-lucide="circle-x"></i>${esc(bl.head || 'Por que parou')}${quando}</div><div class="problem-text">${esc(bl.texto || '')}</div>${detalhe}</div>`;
  }
  if (bl.tipo === 'need') return apNeedBlock(bl.texto || '');
  // Arquivos que o passo produziu — mesmo chip de material que o resto do protótipo usa
  // (visualizar/baixar inclusos). Sempre visível: o arquivo é o RESULTADO do passo, não
  // histórico. Quem abre a tarefa procurando o entregável não devia ter que clicar pra achar.
  if (bl.tipo === 'arquivos') {
    const itens = bl.itens || [];
    if (!itens.length) return '';
    return `<div><div class="lab-bl-label">${esc(bl.label || 'Arquivos')}</div>
      <div class="lab-arqs">${itens.map((x) => materialChip(x)).join('')}</div></div>`;
  }
  if (bl.tipo === 'destino') {
    const abrir = `flash('Protótipo: a pasta abriria no ${esc(bl.onde || 'GDocs')}.')`;
    return `<div><div class="lab-bl-label">Guardado em${bl.onde ? ` · ${esc(bl.onde)}` : ''}</div>
      <div class="lab-arqs"><div class="material-chip lab-chip-pasta" onclick="${abrir}">
        <i data-lucide="folder"></i>
        <span class="material-chip-name">${esc(bl.pasta || 'Pasta da competência')}</span>
        ${bl.n ? `<span class="material-chip-tag tag-doc">${bl.n} documento${bl.n > 1 ? 's' : ''}</span>` : ''}
        <div class="material-chip-actions"><button class="material-chip-btn" title="Abrir pasta" onclick="event.stopPropagation(); ${abrir}"><i data-lucide="external-link"></i></button></div>
      </div></div></div>`;
  }
  if (bl.tipo === 'dados-solicitacao') return labDadosSolicitacao(t, bl.opts);
  if (bl.tipo === 'dados-aluguel') return aluRegistroHTML(t);
  /* Painel do Gestta: a função é a DO NÚCLEO, sem uma linha de diferença — é o mesmo painel azul
     com o nome sugerido que a tela de execução do fluxo mostra. O nome sai de
     `buildGesttaTaskName`, que lê o formulário da tarefa (por isso precisa do formData montado). */
  if (bl.tipo === 'painel-gestta') { labFormData(t); return renderTaskIdPanel(t); }
  if (bl.tipo === 'mensagem-final') {
    // Passo feito: o bloco é registro do que foi enviado, não formulário. Não há por que oferecer
    // campo e "Anexar" numa entrega que já saiu.
    if (bl.feito) return labMsgFinalRegistro(t);
    if (labPodeAgir(t)) return labMsgFinalForm(t);
    const motivoAnexo = 'Só quem está com a tarefa executa os passos';
    return `<div title="${motivoAnexo}" style="cursor:not-allowed;"><fieldset disabled style="border:none;margin:0;padding:0;opacity:0.55;">${labMsgFinalForm(t)}</fieldset></div>`;
  }
  if (bl.tipo === 'atuacao') {
    const resp = bl.resposta ? `Teve que corrigir alguma coisa? <strong>${bl.resposta === 'sim' ? 'Sim' : 'Não, estava tudo certo'}</strong>` : 'Resposta do operador';
    const obs = bl.obs ? `<div class="ta-obs">“${esc(bl.obs)}”</div>` : '';
    const anexos = (bl.anexos && bl.anexos.length) ? `<div class="ta-anexos">${bl.anexos.map((x) => materialChip(x)).join('')}</div>` : '';
    return `<div class="ta-acao ta-op"><i data-lucide="message-square-text"></i><div class="ta-acao-body"><div class="ta-text">${resp}</div>${obs}${anexos}</div></div>`;
  }
  return '';
}

/* ---------- MENSAGEM E ENTREGA AO CLIENTE — o passo final de DP ---------- */
function labMsgFinalTexto(t) { return (state._clientReply && state._clientReply[t.id]) || ''; }
function labMsgFinalArqs(t) { return (state._gdocsFiles && state._gdocsFiles[t.id]) || []; }

/* Guarda o texto SEM re-renderizar — mesma razão do labRascunho: quem está digitando perderia o
   foco a cada tecla. O `setClientReply` do núcleo é quem escreve (ele acha a tarefa por
   `state.currentTaskId`, que o labMount aponta pra tarefa do lab). */
function labMsgFinalEscrever(valor) {
  setClientReply(valor);
}

function labMsgFinalChips(t, removivel) {
  const arqs = labMsgFinalArqs(t);
  if (!arqs.length) return '';
  return `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">${arqs
    .map((f, idx) => renderFileItem(f, { removable: !!removivel, removeFn: `removeGdocsFile(${idx})` }))
    .join('')}</div>`;
}

/* O FORMULÁRIO. A ordem é a da conversa com o cliente: primeiro a regra (o card azul), depois o que
   você diz, depois o que você manda junto.
   O card azul é o MESMO componente que o núcleo já usava neste passo (fundo `--info-soft`, borda
   #bfdbfe, texto #1e40af) — muda o ícone e o texto, não o objeto. O campo e o botão de anexar são
   os do `renderClientReplySection`, que é o padrão do projeto pra "mensagem que vai pro cliente":
   rótulo com asterisco rosa, textarea que cresce, botão branco com clipe. Nenhum padrão novo. */
function labMsgFinalForm(t) {
  const txt = labMsgFinalTexto(t);
  return `
    <div style="background:var(--info-soft);border:1px solid #bfdbfe;border-radius:10px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start;">
      <i data-lucide="send" style="width:18px;height:18px;color:var(--info);flex-shrink:0;margin-top:2px;"></i>
      <div style="flex:1;font-size:13px;line-height:1.55;color:#1e40af;">
        <div style="font-weight:600;margin-bottom:4px;">O que você escrever e anexar aqui vai para o cliente.</div>
        <div>Quando você concluir a solicitação, a mensagem e os arquivos aparecem para ele no HUB, dentro desta solicitação.</div>
      </div>
    </div>
    <div class="field-label mb-2" style="margin-top:18px;">Mensagem para o cliente <span style="color:var(--brand-pink);">*</span></div>
    <p style="font-size:12.5px;color:var(--text-secondary);line-height:1.55;margin:0 0 8px;">Conte o que foi feito e o que ele está recebendo. Ex.: Admissão registrada. Segue o contrato de experiência e a ficha de registro para assinatura.</p>
    <textarea id="lab-msg-final" oninput="labMsgFinalEscrever(this.value)"
      style="width:100%;box-sizing:border-box;min-height:110px;padding:12px;border:1px solid var(--border-strong);border-radius:10px;font-family:inherit;font-size:13px;line-height:1.55;resize:vertical;outline:none;"
      onfocus="this.style.borderColor='var(--brand-pink)'" onblur="this.style.borderColor='var(--border-strong)'">${esc(txt)}</textarea>
    <div class="lab-bl-label" style="margin-top:18px;">Arquivos para o cliente <span style="text-transform:none;letter-spacing:0;font-weight:400;">(opcional)</span></div>
    <input type="file" id="gdocs-file-input" style="display:none;" multiple onchange="handleFileSelect(event)" />
    <div><button class="lab-anexar-btn" onclick="document.getElementById('gdocs-file-input').click()"><i data-lucide="paperclip" style="width:14px;height:14px;"></i>Anexar arquivo para o cliente</button></div>
    ${labMsgFinalChips(t, true)}
  `;
}

/* O REGISTRO, depois de feito. A entrega já saiu: o que a tela tem a fazer é mostrar o que o
   cliente recebeu. A caixa da mensagem é a `.lab-tl-msg` — a mesma que o painel de Histórico usa
   pra mostrar mensagem do HUB, porque é a mesma coisa vista de outro lugar.
   Sem mensagem (tarefa fechada antes desta regra existir) o bloco DIZ isso, em âmbar: é o furo que
   a reunião apontou, e esconder deixaria o registro parecendo completo. */
function labMsgFinalRegistro(t) {
  const txt = labMsgFinalTexto(t).trim();
  const arqs = labMsgFinalArqs(t);
  const msg = txt
    ? `<div class="lab-tl-msg">${esc(txt)}</div>`
    : `<div class="lab-espera-aviso" style="margin-top:0;"><i data-lucide="alert-triangle"></i>Nenhuma mensagem foi enviada — o cliente recebeu a solicitação concluída sem explicação.</div>`;
  const arquivos = arqs.length
    ? `<div class="lab-bl-label" style="margin-top:16px;">Arquivos enviados</div>${labMsgFinalChips(t, false)}`
    : `<div class="lab-bl-label" style="margin-top:16px;">Arquivos enviados</div><p class="lab-vazio" style="font-size:12.5px;">Nenhum arquivo — só a mensagem.</p>`;
  return `<div>
    <div class="lab-bl-label">Enviado ao cliente</div>
    ${msg}
    ${arquivos}
  </div>`;
}

/* O passo final só fecha COM MENSAGEM. O bloqueio mora no caminho de marcar como feito (e no
   confirmar do modal, como rede) em vez de desabilitar o botão: botão morto não diz por quê, e o
   flash + foco no campo levam a pessoa exatamente pra onde falta coisa. */
function labMsgFinalPendente(t, p) {
  if (!p || !(p.blocos || []).some((b) => b.tipo === 'mensagem-final')) return false;
  return !labMsgFinalTexto(t).trim();
}

const LAB_V1_ENTREGA = {
  'T-2049': {
    texto: 'Admissão do Rafael registrada na Domínio e transmitida ao eSocial. Seguem o contrato de experiência e a ficha de registro para assinatura, e o recibo do eSocial para o arquivo de vocês. O adicional de insalubridade de 20% já entrou no cadastro — qualquer mudança no percentual me avise antes do fechamento da folha.',
    arquivos: [
      { name: 'Contrato-de-experiencia-Rafael-Nogueira-Dias.pdf', size: '184 KB' },
      { name: 'Ficha-de-registro-Rafael-Nogueira-Dias.pdf', size: '96 KB' },
      { name: 'Recibo-eSocial-S2200.pdf', size: '48 KB' },
    ],
  },
};

function labSemearMsgFinal(t) {
  const seed = LAB_V1_ENTREGA[t.id];
  if (!seed) return;
  if (!state._clientReply) state._clientReply = {};
  if (!state._clientReply[t.id]) state._clientReply[t.id] = seed.texto;
  if (!state._gdocsFiles[t.id].length) state._gdocsFiles[t.id] = seed.arquivos.slice();
}

function labMsgFinalCobrar() {
  flash('Escreva a mensagem que o cliente vai receber antes de concluir.', 'warning');
  const ta = document.getElementById('lab-msg-final');
  if (ta) { ta.focus(); ta.scrollIntoView({ block: 'center', behavior: 'smooth' }); ta.style.borderColor = 'var(--brand-pink)'; }
}

/* ---------- EVENTOS DO PASSO ---------- */
const LAB_EV_ROTULO = { ok: 'Concluído com sucesso', erro: 'Falhou' };

function labEvNota(t) {
  return labTipo(t) === 'robo'
    ? 'Motor executou e reportou sucesso — sem divergências no retorno.'
    : 'Passo concluído pelo operador, sem pendência registrada.';
}

function labEventos(t, p) {
  const evs = (p.hist || []).map((h) => Object.assign({}, h));
  // O evento que faltava: o passo rodou (ou travou) e a tarefa não declarou nada.
  if (!evs.length && p.state === 'done') evs.push({ tipo: 'ok', quando: p.quando || '', texto: '' });
  if (!evs.length && p.state === 'failed') evs.push({ tipo: 'erro', quando: p.quando || '', texto: '' });
  if (p.falha) {
    let alvo = null;
    for (let k = evs.length - 1; k >= 0; k--) if (evs[k].tipo === 'erro') { alvo = evs[k]; break; }
    if (alvo) {
      if (!alvo.texto) alvo.texto = p.falha.texto || '';
      if (!alvo.comparativo) alvo.comparativo = p.falha.comparativo || null;
      if (!alvo.link) alvo.link = p.falha.link || null;
      if (!alvo.need) alvo.need = p.falha.need || '';
    }
  }
  if (!evs.length) return [];
  // Cada evento leva os comentários dele; os sem dono vão para o mais provável.
  evs.forEach((e, k) => { e.coment = (p.coment || []).filter((c) => c.lanc === k); });
  const orfaos = (p.coment || []).filter((c) => c.lanc === undefined || c.lanc === null);
  if (orfaos.length) {
    let alvo = evs.length - 1;
    for (let k = 0; k < evs.length; k++) if (evs[k].tipo === 'erro') alvo = k;
    evs[alvo].coment = evs[alvo].coment.concat(orfaos);
  }
  return evs;
}

function labPassoTemHist(t) { return t.status !== 'cancelled'; }

function labPassoHist(t, p, i, opts) {
  const recolhivel = !!(opts && opts.recolhivel);
  const seta = recolhivel
    ? `<div class="step-chev-row"><span class="step-hist step-chev${_lab.expandido[i] ? ' open' : ''}"><i data-lucide="chevron-down" class="ex-chev" style="width:14px;height:14px;"></i></span></div>`
    : '';
  const evs = labPassoTemHist(t) ? (p.eventos || []) : [];
  // Passo que não rodou não tem o que registrar — mas se ele recolhe, a seta continua sendo o
  // gesto do bloco e tem que estar no mesmo canto dos outros.
  if (!evs.length) return seta;
  const temFalha = evs.some((e) => e.tipo === 'erro');
  const viva = temFalha && p.state === 'failed';
  const alerta = temFalha
    ? `<span class="step-alerta ${viva ? 'viva' : 'velha'}"><i data-lucide="circle-alert"></i></span>`
    : '';
  const nCmt = (p.coment || []).length;
  const cmt = nCmt
    ? `<span class="step-ev-cmt" title="${nCmt} comentário${nCmt > 1 ? 's' : ''} neste passo"><i data-lucide="message-square"></i>${nCmt}</span>`
    : '';
  const dica = viva ? 'Falhou e está parado aqui — ver o que aconteceu' : (temFalha ? 'Teve falha durante a execução' : 'Ver o que aconteceu neste passo');
  return `<div class="step-hist-row">
    <button class="lab-conversa-btn step-ev-btn${viva ? ' viva' : ''}" title="${dica}" onclick="event.stopPropagation(); labEventosAbrir(${i})">${cmt}${alerta}<span>Eventos (${evs.length})</span></button>
  </div>${seta}`;
}

function labEstadoVisual(t, p) {
  if (p.state === 'active' && labEhAutopilot(t)) return 'pending';
  return p.state;
}

function labPassoEstado(t, p, i) {
  const posse = labPosse(t);
  const st = labEstadoVisual(t, p);
  const off = !labPodeAgir(t);
  const motivo = 'Só quem está com a tarefa executa os passos';
  const desliga = ` disabled title="${motivo}" style="opacity:0.45;cursor:not-allowed;"`;
  let tag = '';
  if (st === 'done') {
    tag = '';
    if (p.acao && p.autoConclui) {
      tag = `<button class="step-edit-btn" onclick="event.stopPropagation(); labAcaoPasso(${i})"${off ? desliga : ''}><i data-lucide="${p.acao.icon}" class="w-3 h-3"></i> ${esc(p.acao.label)}</button>` + tag;
    }
  } else if (st === 'failed') tag = `<span class="badge" style="background:#fef2f2;color:var(--danger);"><i data-lucide="alert-triangle" class="w-3 h-3"></i> Falhou</span>`;
  else if (st === 'active') {
    let acaoBtn = '';
    if (p.acao) {
      /* A ação continua clicável depois do clique: baixar de novo, reabrir o Gestta.
         Quem diz que o passo acabou é o "Marcar como feito", não o botão. */
      acaoBtn = `<button class="step-action" onclick="labAcaoPasso(${i})"${off ? desliga : ''}><i data-lucide="${p.acao.icon}" class="w-3.5 h-3.5"></i> ${esc(p.acao.label)}</button>`;
    }
    const rotuloFeito = (p.blocos || []).some((b) => b.tipo === 'mensagem-final') ? 'Concluir' : 'Marcar como feito';
    const marcar = p.autoConclui ? '' : (labPodeAgir(t)
      ? `<button class="step-mark-done" onclick="labMarcarFeito(${i})"><i data-lucide="check" class="w-3.5 h-3.5"></i> ${rotuloFeito}</button>`
      : `<button class="step-mark-done"${desliga}><i data-lucide="check" class="w-3.5 h-3.5"></i> ${rotuloFeito}</button>`);
    tag = acaoBtn + marcar;
  } else tag = `<span class="step-espera">Aguardando</span>`;
  if (!tag) return '';
  return `<div class="step-status">${tag}</div>`;
}

function labPasso(t, p, i) {
  const st = labEstadoVisual(t, p);
  p.eventos = labEventos(t, p);
  const icone = st === 'done' ? 'check' : (st === 'failed' ? 'x' : '');
  const num = icone ? `<i data-lucide="${icone}"></i>` : '';
  const cls = `exec-step${st === 'done' ? ' done' : ''}${st === 'active' ? ' active' : ''}${st === 'failed' ? ' failed' : ''}`;
  const dim = st === 'pending' ? 'opacity:0.55;' : '';

  // Corpo = os blocos que o passo declarou + o histórico, quando aberto. Cada peça vai
  // EMBRULHADA e o corpo é uma coluna com gap: sem isso as peças ficam coladas (o acordeon
  // de comentários encostava no texto da atuação, parecendo estar por cima dele). O embrulho
  // é necessário porque um bloco pode devolver mais de um elemento — os dados da solicitação,
  // por exemplo, devolvem rótulo + card + botão, e o gap não pode separar esses três.
  const blocos = (p.blocos || []).map((bl) => labBloco(t, bl)).filter(Boolean);
  const recolhivel = st === 'done' && blocos.length > 0;
  const pecas = (recolhivel && !_lab.expandido[i]) ? [] : blocos;
  const corpo = pecas.length ? `<div class="step-corpo">${pecas.map((x) => `<div>${x}</div>`).join('')}</div>` : '';

  return `<div class="${cls}" style="${dim}flex-direction:column;align-items:stretch;">
    <div class="exec-step-header${recolhivel ? ' collapsible' : ''}"${recolhivel ? ` onclick="labPassoToggle(${i})"` : ''}>
      <div class="step-num${icone ? '' : ' pend'}">${num}</div>
      <div style="flex:1;min-width:0;">
        <div class="lab-titulo-hora" style="margin-bottom:4px;">
          <span style="font-weight:600;">${esc(p.nome)}</span>
          ${(p.quando && st !== 'failed') ? `<span class="step-sep"></span><span class="step-when">${esc(p.quando)}</span>` : ''}
        </div>
        ${p.desc ? `<div style="font-size:12.5px;color:var(--text-secondary);line-height:1.55;">${esc(p.desc)}</div>` : ''}
      </div>
      <div class="step-side">${labPassoEstado(t, p, i)}${labPassoHist(t, p, i, { recolhivel })}</div>
    </div>
    ${corpo ? `<div style="margin-top:14px;">${corpo}</div>` : ''}
  </div>`;
}

/* ---------- os dados da solicitação ---------- */
function labDadosSolicitacao(t, opts) {
  const o = opts || {};
  if (!(_tsmSecoes(t) || []).length) return `<div class="lab-vazio">Esta solicitação não trouxe formulário — o pedido do cliente está na conversa.</div>`;
  labFormData(t);
  const titulo = ('titulo' in o) ? o.titulo : 'Dados da solicitação original';
  const label = titulo ? `<div style="font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-bottom:10px;">${esc(titulo)}</div>` : '';
  return `${label}${renderFormReference(t, !!o.primeiroAberto)}`;
}

/* O bloco de campos da Validação. O markup é o do #screen-task (cockpit-core.js): os ids
   #form-collab-strip / #form-tabs / #form-edit-btn / #form-content existem porque é NELES que o
   `renderForm` do núcleo escreve — o lab só entrega a casca e chama a função depois de montar
   (labPintaForm). Zero markup de formulário próprio.
   O botão Editar do núcleo é substituído quando o lab precisa mudar o gesto: em leitura ele fica
   desativado, e numa visita a uma etapa passada ele abre o modal de voltar pra Validação. */
function labFormBloco(t) {
  labFormData(t);
  return `<div id="form-collab-strip"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
      <div class="form-tabs" id="form-tabs"></div>
      <div id="form-edit-btn"></div>
    </div>
    <div id="form-content"></div>`;
}

/* Chamado depois de cada render: pinta o formulário (abas + campos) e os anexos com as funções do
   núcleo, e só então ajusta o botão Editar pro modo da tela. */
function labPintaForm(t) {
  if (!document.getElementById('form-content')) return;
  renderForm(t, _lab.aba || null);
  renderClientAttachments(t);
  labAjustaEditar(t);
  refreshIcons();
}

/* Anexar e remover documento no último passo são as funções do núcleo (`handleFileSelect` →
   `addFilesToGdocs`, `removeGdocsFile`), chamadas de dentro do card que ele mesmo desenha. Elas
   terminam pedindo `renderExecution(task)`, que escreve nos ids da tela de execução do fluxo — que
   não existem aqui. Redirecionar pro labRender é o que faz o anexo funcionar sem duplicar nada. */
if (typeof renderExecution === 'function') {
  window.renderExecution = function () { if (_lab.t) labRender(); };
}

/* Salvar e Cancelar são os do núcleo — eles repintam só o bloco do formulário (`renderForm`), o
   que é bom: o resto da tela não pisca. O problema é que, ao repintar, o botão Editar volta a ser
   o do núcleo e perde o ajuste de modo do lab. Daí o embrulho: chama o original e reajusta. */
['saveEdits', 'cancelEdits', 'enterEditMode'].forEach((nome) => {
  const original = window[nome];
  if (typeof original !== 'function') return;
  window[nome] = function () {
    original.apply(null, arguments);
    if (_lab.t) labAjustaEditar(_lab.t);
    refreshIcons();
  };
});

// `labPosse` já devolve 'encerrada' para concluída/cancelada, então só 'minha' passa.
function labPodeEditar(t) { return labPosse(t) === 'minha'; }

function labAjustaEditar(t) {
  const cx = document.getElementById('form-edit-btn');
  if (!cx) return;
  const btn = Array.from(cx.querySelectorAll('button')).find((b) => /Editar/.test(b.textContent));
  if (!btn) return; // em modo de edição o núcleo não desenha o botão
  if (!labPodeEditar(t)) {
    btn.disabled = true;
    btn.style.opacity = '0.45';
    btn.style.cursor = 'not-allowed';
    btn.onclick = null;
    const motivo = {
      encerrada: 'A tarefa está encerrada: os dados não mudam mais.',
      ninguem: 'A tarefa não tem dono. Atribua a você para editar.',
      outro: 'A tarefa é de outro operador.',
      robo: 'Esta tarefa é do robô.',
    };
    btn.title = motivo[labPosse(t)] || 'Os dados não podem ser editados.';
    return;
  }
  // Visita a uma etapa já vivida: editar tem consequência (a tarefa REGRIDE e o cliente vê),
  // então o gesto passa pelo modal em vez de abrir os campos direto.
  if (labVisitando(t)) btn.onclick = () => labVoltarValidacao({ editar: true });
}

/* ---------- miolo da VALIDAÇÃO ---------- */
function labEsperaCard(t) {
  if (!labEmEspera(t)) return '';
  return `<div style="background:var(--warning-soft);border:1px solid #f59e0b;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--warning);display:flex;gap:10px;align-items:flex-start;">
    <i data-lucide="clock" class="w-4 h-4" style="flex-shrink:0;margin-top:2px;"></i>
    <div><div style="font-weight:600;">Aguardando o cliente${t.stationedAt ? ` desde ${esc(labQuandoExato(t, t.stationedAt))}` : ''}</div>
    <div style="margin-top:2px;">${esc(t.stationedReason || 'Falta um complemento para dar sequência.')}</div></div>
  </div>`;
}

function labValidacao(t) {
  const posse = labPosse(t);
  const visita = labVisitando(t);

  // Só no caso de leitura a tela precisa dizer por que não há decisão nenhuma. Em `?ro=1` a
  // tarefa É sua — então o motivo não é posse, é o modo em que você entrou.
  let nota = '';
  if (!labPodeAgir(t)) {
    // Em leitura a nota diz o que NÃO se faz. Quando a tarefa é sua, editar os dados continua
    // valendo (labPodeEditar) — a frase precisa dizer isso, senão contradiz o botão ativo ao lado.
    if (posse === 'ninguem') nota = '<p style="color:var(--text-secondary);font-size:13px;margin:14px 0 20px;">A tarefa ainda não tem dono: aqui é leitura. Para conferir os dados e dar sequência, atribua a você.</p>';
    else if (posse === 'encerrada') nota = '<p style="color:var(--text-secondary);font-size:13px;margin:14px 0 20px;">A tarefa já foi encerrada: o que você vê é o registro do que foi feito. Comentar nos eventos continua aberto.</p>';
    else nota = '<p style="color:var(--text-secondary);font-size:13px;margin:14px 0 20px;">Você está lendo uma tarefa que não é sua: os controles ficam desativados.</p>';
  }

  const podeDecidir = labPodeAgir(t);
  const motivoDecisao = posse === 'ninguem'
    ? 'A tarefa não tem dono — atribua a você para decidir'
    : 'Só quem está com a tarefa decide';
  const desligaDecisao = podeDecidir ? '' : ` disabled title="${motivoDecisao}" style="opacity:0.45;cursor:not-allowed;"`;
  const decisao = !visita
    ? `<div class="decision-card">
        <div class="decision-title">Dados da solicitação — tem tudo que é necessário para processar?</div>
        <div class="decision-desc">Confira se os dados do formulário e os anexos do cliente estão completos e corretos para prosseguir com o processamento.</div>
        <div class="decision-btns">
          <button class="btn-decision-yes" ${podeDecidir ? 'onclick="labAceitarTarefa()"' : desligaDecisao}><i data-lucide="check" class="w-4 h-4"></i>Sim, processar</button>
          <button class="btn-decision-no" ${podeDecidir ? 'onclick="labConversaAbrir()"' : desligaDecisao}><i data-lucide="message-circle" class="w-4 h-4"></i>Não, pedir algo ao cliente</button>
        </div>
      </div>`
    : '';

  const temForm = !!(_tsmSecoes(t) || []).length;
  const corpo = temForm
    ? labFormBloco(t)
    : `<div class="lab-vazio">Esta solicitação não trouxe formulário — o pedido do cliente está na conversa.</div>`;

  /* Dois cards, na ordem do projeto: Dados da solicitação, depois Anexos enviados pelo cliente.
     O card de anexos é o #attachments-block do núcleo — os ids são o que o
     `renderClientAttachments` procura pra preencher a contagem e a lista. */
  return `<div class="section-card">
    <div class="section-title" style="margin-bottom:0;"><i data-lucide="file-text"></i>Dados da solicitação</div>
    ${nota}
    ${labEsperaCard(t) ? `<div style="margin:${nota ? '16px' : '18px'} 0 18px;">${labEsperaCard(t)}</div>` : ''}
    <div style="margin-top:${(nota || labEsperaCard(t)) ? '0' : '18px'};">${corpo}</div>
  </div>
  <div class="section-card" id="attachments-block">
    <div class="section-title"><i data-lucide="paperclip"></i>Anexos enviados pelo cliente<span id="attachments-count-badge" class="badge badge-neutral" style="margin-left:8px;font-size:10px;">0</span></div>
    <div class="flex flex-wrap gap-2" id="attachments-list"></div>
  </div>${decisao}`;
}

function labFimDoRoteiro(t, passos) {
  const tipo = labTipo(t);
  const encerrada = t.status === 'completed';

  const alu = aluEhAluguel(t);
  if (!encerrada) {
    if (tipo !== 'hitl') return '';
    return `<div class="lab-fim">
      <div class="lab-fim-linha"><span class="lab-fim-selo"><i data-lucide="circle-check"></i>Tarefa devolvida ao Autopilot</span></div>
      <div class="lab-fim-sub">${alu ? 'O Motor Fiscal segue a apuração a partir daqui.' : 'O motor está reprocessando a partir daqui.'}</div>
    </div>`;
  }

  // Quem concluiu + quando. A hora é a do ÚLTIMO passo, não um relógio à parte: o processo
  // acabou quando o último passo acabou.
  let quem, quando;
  if (tipo === 'robo') {
    quem = 'Autopilot';
    quando = (passos[passos.length - 1] || {}).quando || _apTime(passos.length);
  } else if (tipo === 'hitl') {
    const atu = labUltimaAtuacao(t);
    quem = (atu && atu.nome) ? atu.nome.split(' · ')[0] : ((acOp(t.operatorId) || {}).nome || OPERATOR_NAME);
    quando = (alu && t.aluguel.enviado) ? t.aluguel.enviado.quando : _apTime(t.apDone || 1);
  } else {
    quem = (acOp(t.operatorId) || {}).nome || OPERATOR_NAME;
    quando = (passos[passos.length - 1] || {}).quando || '';
  }

  return `<div class="lab-fim">
    <div class="lab-fim-linha"><span class="lab-fim-selo"><i data-lucide="circle-check"></i>Tarefa concluída</span></div>
    <div class="lab-fim-sub">Concluída por <strong style="color:var(--text-secondary);">${esc(quem)}</strong>${quando ? ` <span style="color:var(--text-tertiary);">·</span> ${esc(quando)}` : ''}</div>
  </div>`;
}

function labExecucao(t) {
  // Cancelada: não tem passos, mas a conversa com o cliente continua sendo o registro
  // de por que aquilo não andou — some do roteiro, não da tela.
  if (t.status === 'cancelled') {
    return `<div class="section-card">
      <div class="section-title" style="margin-bottom:0;"><i data-lucide="list-checks"></i>Execução</div>
      <div class="lab-vazio" style="margin-top:14px;">A tarefa foi cancelada antes de ser processada — não há passos executados.</div>
    </div>`;
  }
  const passos = labRoteiro(t);
  if (!passos.length) return '';
  const acima = [labEsperaCard(t)].filter(Boolean);
  let body = acima.length ? `<div style="display:flex;flex-direction:column;gap:14px;margin-bottom:18px;">${acima.map((x) => `<div>${x}</div>`).join('')}</div>` : '';
  let grupo = null;
  passos.forEach((p, i) => {
    if (p.grupo && p.grupo !== grupo) { body += `<div class="lab-grupo">${esc(p.grupo)}</div>`; grupo = p.grupo; }
    body += labPasso(t, p, i);
  });
  body += labFimDoRoteiro(t, passos);
  // O texto de apoio muda com QUEM executa o roteiro: no robô os passos são do motor
  // (ninguém marca à mão); no HITL o roteiro é o registro do que você fez; no DP, de quem
  // está com a tarefa.
  const posse = labPosse(t);
  let nota;
  if (aluEhAluguel(t)) {
    nota = 'Os dados preenchidos estão registrados abaixo. O Motor Fiscal segue a apuração a partir daqui.';
  } else if (labTipo(t) === 'hitl') {
    nota = 'O que você respondeu está registrado abaixo. O Autopilot seguiu o processo a partir daqui.';
  } else if (labEhAutopilot(t)) {
    nota = labPodeAgir(t)
      ? 'Os passos são executados pelo Autopilot: você resolve a anomalia e devolve ao motor. Os eventos de cada passo guardam as tentativas e os comentários.'
      : 'Os passos avançam pelo motor do Autopilot. Você pode ler tudo e comentar em qualquer evento.';
  } else if (labPodeAgir(t)) {
    nota = 'Marque cada passo como feito para avançar.';
  } else if (labPosse(t) === 'encerrada') {
    nota = 'A tarefa já foi encerrada: o que você vê é o registro do que foi feito. Comentar nos eventos continua aberto.';
  } else {
    nota = 'Você está lendo uma tarefa que não é sua: os controles ficam desativados.';
  }
  return `<div class="section-card">
    <div class="section-title" style="margin-bottom:0;"><i data-lucide="list-checks"></i>Execução</div>
    <p style="color:var(--text-secondary);font-size:13px;margin:14px 0 20px;">${nota}</p>
    <div>${body}</div>
  </div>`;
}

// Só existe quando há cliente do outro lado — nunca numa tarefa do robô, onde o botão
// simplesmente não é emitido e o Histórico fica sozinho na direita.
function labConversaBtn(t) {
  if (labEhAutopilot(t)) return '';
  const n = labMsgs(t).length;
  const dot = t.labClienteRespondeu ? `<span class="lab-dot" title="O cliente respondeu e você ainda não abriu"></span>` : '';
  return `<button class="lab-conversa-btn" onclick="labConversaAbrir()">${dot}<i data-lucide="message-square" style="width:15px;height:15px;"></i>Conversa com o cliente${n ? ` <span style="color:var(--text-tertiary);">(${n})</span>` : ''}</button>`;
}

/* ---------- eventos do passo (PAINEL LATERAL) ----------
   Foram popover, depois acordeon dentro do passo, e (COCKPIT-1323) são painel — o
   mesmo que já servia o Histórico e a Conversa. O que decidiu foi a separação: dentro do passo,
   o que se usa pra EXECUTAR e o REGISTRO do que aconteceu dividiam a mesma caixa.
   O TÍTULO DO PAINEL É O DO PASSO (nome + descrição): quem abriu precisa saber de qual passo
   está lendo o registro, e esses dois textos já existem no cabeçalho — nenhum rótulo novo.
   O passo é relido de `labRoteiro` a cada abertura: os comentários vivem na tarefa e o roteiro
   se remonta, então o painel sempre mostra o estado de agora. */
function labEventosAbrir(i) {
  const t = _lab.t;
  const p = (labRoteiro(t) || [])[i];
  if (!p) return;
  // Depois do labDrawerAbrir: ele fecha o painel anterior, e fechar limpa estes dois.
  labDrawerAbrir({ titulo: p.nome, sub: p.desc || '', corpo: labEventosCorpo(t, i) });
  _lab.drawerQual = 'eventos';
  _lab.evPasso = i;
}

/* Comentar redesenha a tela (a contagem do botão muda), e o painel tem que acompanhar sem
   piscar: só o corpo é reescrito, o painel não reabre. Chamado do labRender. */
function labEventosRedesenhar() {
  const body = document.querySelector('#lab-drawer-bd .lab-drawer-body');
  if (!body || _lab.evPasso === null) return;
  body.innerHTML = labEventosCorpo(_lab.t, _lab.evPasso);
  refreshIcons();
}

function labEventosCorpo(t, i) {
  const p = (labRoteiro(t) || [])[i];
  if (!p) return '';
  p.eventos = labEventos(t, p);
  return labHistHTML(t, p, i);
}

// Quem executou: o robô é o Autopilot, o HITL é quem atuou, o DP é o dono da tarefa.
function labQuemExecutou(t, ev) {
  if (ev && ev.quem) return ev.quem;
  const tipo = labTipo(t);
  if (tipo === 'robo') return 'Autopilot';
  if (tipo === 'hitl') {
    const atu = labUltimaAtuacao(t);
    if (atu && atu.nome) return atu.nome.split(' · ')[0];
  }
  return (acOp(t.operatorId) || {}).nome || '';
}

function labHistHTML(t, p, i) {
  const linhas = (p.eventos || []).map((h, k) => {
    const erro = h.tipo === 'erro';
    // O evento pode trazer rótulo próprio; sem ele, quem nomeia a linha é o estado.
    const rotulo = h.rotulo || LAB_EV_ROTULO[h.tipo] || (erro ? 'Falhou' : 'Concluído com sucesso');
    /* Texto do evento. Na falha é o que o motor devolveu — inclusive o da falha que está travando
       o passo agora, que vem para cá em vez de ficar num card solto (labEventos). Se
       ele repetiria a descrição do passo, o sucesso cai na nota de marcação (labEvNota). */
    const proprio = (h.texto && h.texto !== p.desc) ? h.texto : '';
    const texto = proprio || (erro ? '' : labEvNota(t));
    const titulo = `<div class="lab-titulo-hora"><span class="lab-try-text" style="font-weight:600;">${esc(rotulo)}</span>${h.quando ? `<span class="step-sep"></span><span class="lab-try-when">${esc(h.quando)}</span>` : ''}</div>`;
    const quem = labQuemExecutou(t, h);
    const porQuem = quem ? `<div class="lab-try-quem">Por ${esc(quem)}</div>` : '';
    const corpo = erro
      ? `${titulo}${texto ? `<div class="ta-err"><div class="ta-err-text">${esc(texto)}</div></div>` : ''}${porQuem}`
      : `${titulo}${texto ? `<div class="ta-det">${esc(texto)}</div>` : ''}${porQuem}`;
    const chave = i + '.' + k;
    return `<div class="lab-try ${erro ? 'erro' : 'ok'}">
      <i data-lucide="${erro ? 'circle-x' : 'circle-check'}"></i>
      <div style="min-width:0;flex:1;">
        <div class="lab-try-head">
          <div style="min-width:0;flex:1;">${corpo}</div>
          <button class="step-cmt lab-try-cmt" title="Comentar neste evento" onclick="labComentarLanc(${i}, ${k})"><i data-lucide="message-square-plus"></i></button>
        </div>
        ${apCmpHTML(h.comparativo)}
        ${h.need ? apNeedBlock(h.need) : ''}
        ${h.link ? `<button class="ap-crosslink" style="margin-top:9px;font-size:11px;padding:5px 10px;" onclick="acNavModal('${h.link.to}')"><i data-lucide="external-link" style="width:14px;height:14px;"></i>${esc(h.link.label)}</button>` : ''}
        ${labFalas(h.coment || [], 'lanc')}
        ${_lab.lancAberto[chave] ? labCmtForm(i, k) : ''}
      </div></div>`;
  }).join('');

  if (!linhas) return '';
  return `<div class="lab-try-lista">${linhas}</div>`;
}

/* Fala de gente. `onde === 'lanc'` põe recuo e FIO À ESQUERDA: é o que mostra que o
   comentário está pendurado num lançamento, e não no passo. Sem esse fio, um comentário
   dentro do lançamento parecia só mais um comentário do passo. */
function labFalas(lista, onde) {
  if (!lista.length) return '';
  const cls = onde === 'lanc' ? 'lab-fala lab-fala-em-lanc' : 'lab-fala';
  return lista.map((c) => `
    <div class="${cls}">
      ${labAvatar(c.autor)}
      <div style="min-width:0;flex:1;">
        <div class="lab-fala-who">${esc(String(c.autor).split(' · ')[0])}<span class="lab-fala-when">${esc(c.quando || '')}</span></div>
        <div class="lab-fala-text">${esc(c.texto)}</div>
        ${(c.anexos && c.anexos.length) ? `<div class="ta-anexos">${c.anexos.map((x) => materialChip(x)).join('')}</div>` : ''}
      </div>
    </div>`).join('');
}

function labCmtForm(i, k) {
  const chave = i + '.' + k;
  const rascunho = _lab.rascunho[chave] || '';
  const arqs = _lab.anexos[chave] || [];
  const arg = `'${chave}', ${i}, ${k}`;
  const lista = arqs.length
    ? `<div class="lab-cmt-arqs">${arqs.map((a, n) => `<div class="material-chip">
        <i data-lucide="paperclip"></i><span class="material-chip-name">${esc(a.name)}</span>
        <div class="material-chip-actions"><button class="material-chip-btn" title="Remover" onclick="labAnexoRemover('${chave}', ${n})"><i data-lucide="x"></i></button></div>
      </div>`).join('')}</div>`
    : '';
  return `<div class="lab-cmt-box em-lanc">
    <div class="lab-cmt-form${rascunho.trim() ? ' com-texto' : ''}" id="lab-cmt-form-${chave}">
      ${labAvatar(OPERATOR_NAME)}
      <textarea id="lab-cmt-${chave}" rows="1" placeholder="Comentar neste evento…"
        oninput="labRascunho('${chave}', this.value)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();labComentar(${arg});}">${esc(rascunho)}</textarea>
      <button class="lab-cmt-send" title="Comentar (Enter)" onclick="labComentar(${arg})"><i data-lucide="arrow-up"></i></button>
    </div>
    ${lista}
    <div class="lab-cmt-hint">
      <input type="file" id="lab-cmt-file-${chave}" multiple style="display:none;" onchange="labAnexoEscolher('${chave}', this)" />
      <button class="lab-cmt-clip" title="Anexar arquivo" onclick="document.getElementById('lab-cmt-file-${chave}').click()"><i data-lucide="paperclip"></i>Anexar</button>
      <span class="lab-cmt-sep"></span>
      <i data-lucide="lock"></i>Comentário interno — o cliente não vê.
    </div>
  </div>`;
}

function labAnexoEscolher(chave, input) {
  const novos = Array.from(input.files || []).map((f) => ({ name: f.name, tag: 'Documento' }));
  if (!novos.length) return;
  _lab.anexos[chave] = (_lab.anexos[chave] || []).concat(novos);
  input.value = '';
  labRender();
}
function labAnexoRemover(chave, n) {
  const lista = _lab.anexos[chave] || [];
  const arq = lista[n];
  if (!arq) return;
  confirmRemoveAttachment(arq.name, () => {
    lista.splice(n, 1);
    if (!lista.length) delete _lab.anexos[chave];
    labRender();
  });
}

// Avatar de iniciais — mesmo gradiente do avatar do shell, em tamanho de linha.
function labAvatar(nome) {
  const iniciais = String(nome || '?').replace(/ · .*$/, '').split(/\s+/).slice(0, 2).map((w) => w[0] || '').join('').toUpperCase();
  return `<div class="lab-av">${esc(iniciais)}</div>`;
}
/* Guarda o rascunho, mostra o botão de enviar e faz o campo CRESCER — tudo sem re-renderizar,
   senão quem está digitando perde o foco. O crescer é o truque de sempre: zera a altura e
   adota a altura do conteúdo (scrollHeight), com teto pra não virar uma página. */
function labRascunho(chave, valor) {
  _lab.rascunho[chave] = valor;
  const form = document.getElementById('lab-cmt-form-' + chave);
  if (form) form.classList.toggle('com-texto', !!valor.trim());
  const ta = document.getElementById('lab-cmt-' + chave);
  if (ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 150) + 'px'; }
}
/* Comentar é permitido SEMPRE (tarefa de outro, do robô, encerrada) — é anotação, não ação
   sobre a tarefa. Só o operador comenta; o robô nunca.
   O comentário fica pendurado no EVENTO k (campo `lanc`) e aparece embaixo dele, recuado.
   Comentário só com anexo vale: mandar a planilha sem escrever nada já diz algo. */
function labComentar(chave, i, k) {
  const txt = (_lab.rascunho[chave] || '').trim();
  const arqs = (_lab.anexos[chave] || []).slice();
  if (!txt && !arqs.length) return;
  const t = _lab.t;
  const cmt = { autor: OPERATOR_NAME + ' · operadora', quando: labAgoraPasso(), texto: txt, lanc: k, anexos: arqs };
  t.labComent = t.labComent || {};
  t.labComent[i] = (t.labComent[i] || []).concat([cmt]);
  _lab.rascunho[chave] = '';
  delete _lab.anexos[chave];
  // O painel fica aberto e se redesenha (labRender chama labEventosRedesenhar): o comentário
  // aparece onde foi escrito, e a contagem do botão sobe no passo, atrás do painel.
  labRender();
  flash('Comentário registrado no evento.', 'success');
}
// O balão do evento abre o campo dele ali mesmo (e nunca fecha — abrir é o que o ícone promete).
function labComentarLanc(i, k) {
  const chave = i + '.' + k;
  if (!_lab.lancAberto[chave]) {
    _lab.lancAberto[chave] = true;
    labRender();
  }
  const ta = document.getElementById('lab-cmt-' + chave);
  if (ta) { ta.focus(); ta.scrollIntoView({ block: 'nearest' }); }
}

/* ---------- painel lateral (um chassi, vários conteúdos) ----------
   Dois painéis usam isto: a Conversa com o cliente e o Histórico. Um só chassi porque são
   a mesma coisa pra quem usa — algo que desliza da direita, por cima, sem tirar você da
   tela. Painel novo = só o conteúdo.
   O deslizar é feito em dois quadros: injeta fora da tela e, no quadro seguinte, liga a
   classe .aberto — sem isso o browser não anima (não há transição de "não existia" pra
   "existe"). Ao fechar, espera a animação antes de remover do DOM. */
function labDrawerAbrir(cfg) {
  labDrawerFechar(true); // um painel por vez
  const bd = document.createElement('div');
  bd.className = 'lab-drawer-bd';
  bd.id = 'lab-drawer-bd';
  bd.onclick = (e) => { if (e.target === bd) labDrawerFechar(); };
  bd.innerHTML = `<aside class="lab-drawer" onclick="event.stopPropagation()">
    <div class="lab-drawer-head">
      <div style="flex:1;min-width:0;">
        <div class="lab-drawer-title">${esc(cfg.titulo || '')}</div>
        ${cfg.sub ? `<div class="lab-drawer-sub">${esc(cfg.sub)}</div>` : ''}
      </div>
      <button class="btn btn-ghost" style="padding:6px;" onclick="labDrawerFechar()"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="lab-drawer-body">${cfg.corpo || ''}</div>
    ${cfg.rodape ? `<div class="lab-drawer-foot">${cfg.rodape}</div>` : ''}
  </aside>`;
  document.body.appendChild(bd);
  requestAnimationFrame(() => bd.classList.add('aberto'));
  _lab.drawer = true;
  refreshIcons();
  if (cfg.fim) labDrawerAoFim();
}

function labDrawerAoFim() {
  const b = document.querySelector('#lab-drawer-bd .lab-drawer-body');
  if (!b) return;
  b.scrollTop = b.scrollHeight;
  // Os ícones entram depois (refreshIcons troca <i> por <svg>) e a altura muda — repete no
  // quadro seguinte pra não parar no meio da última mensagem.
  requestAnimationFrame(() => { b.scrollTop = b.scrollHeight; });
}
function labDrawerFechar(imediato) {
  const bd = document.getElementById('lab-drawer-bd');
  _lab.drawer = false;
  _lab.drawerQual = null;
  _lab.evPasso = null;
  if (!bd) return;
  if (imediato) { bd.remove(); return; }
  bd.classList.remove('aberto');
  setTimeout(() => bd.remove(), 240); // igual à transição do CSS
}

/* ---------- conversa com o cliente ---------- */
function labMsgs(t) { return _tsmMsgs(t) || []; }
function labConversaRodape(t) {
  const posse = labPosse(t);
  const nota = (txt) => `<div class="lab-drawer-nota"><i data-lucide="info" style="width:15px;height:15px;flex-shrink:0;margin-top:1px;"></i><div>${txt}</div></div>`;

  // Tarefa encerrada é o único caso em que o campo NÃO aparece: o canal fechou pra todo
  // mundo, pra sempre — a ação não existe mais no tempo (mesma família da visita).
  if (posse === 'encerrada') {
    return nota(t.status === 'cancelled'
      ? 'Esta tarefa foi <strong>cancelada</strong> e por isso não permite mais troca de mensagens.'
      : 'Esta tarefa já foi <strong>concluída</strong> e por isso não permite mais troca de mensagens.');
  }
  if (posse !== 'minha') {
    const aviso = 'Só quem está com a tarefa responde ao cliente. Aqui a conversa é leitura.';
    const motivo = 'Só quem está com a tarefa responde ao cliente';
    return `${nota(aviso)}
      <textarea placeholder="Escreva para o cliente…" disabled style="opacity:0.5;cursor:not-allowed;" title="${motivo}"></textarea>
      <div style="margin-top:10px;opacity:0.5;cursor:not-allowed;" title="${motivo}"><button class="lab-anexar-btn" disabled style="cursor:not-allowed;"><i data-lucide="paperclip" style="width:14px;height:14px;"></i>Anexar arquivo</button></div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px;">
        <button class="btn btn-primary" disabled style="opacity:0.5;cursor:not-allowed;" title="${motivo}"><i data-lucide="send" class="w-4 h-4"></i>Enviar</button>
      </div>`;
  }

  const campo = `<textarea placeholder="Escreva para o cliente…" oninput="labRespBtn()" id="lab-resp-input"></textarea>${labRespAnexoCampo()}`;
  if (labEmEspera(t)) {
    return `${campo}
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;">
        <span style="font-size:11.5px;color:var(--text-tertiary);">A tarefa já está em espera aguardando o cliente.</span>
        <button class="btn btn-primary" id="lab-resp-btn" disabled style="opacity:0.5;cursor:not-allowed;" onclick="labResponder()"><i data-lucide="send" class="w-4 h-4"></i>Enviar</button>
      </div>`;
  }
  // Vem marcado: pedir algo ao cliente é o motivo mais comum de escrever pra ele, e era o
  // comportamento que o rodapé já anunciava. Quem só quer avisar desmarca.
  return `${campo}
    <label class="lab-espera-opt">
      <input type="checkbox" id="lab-espera-chk" ${_lab.espera ? 'checked' : ''} onchange="labEsperaToggle(this.checked)" />
      <span>Colocar a tarefa em espera aguardando o cliente</span>
    </label>
    <div class="lab-espera-aviso" id="lab-espera-aviso" style="${_lab.espera ? '' : 'display:none;'}">
      <i data-lucide="alert-triangle"></i>
      <div>A fase atual fica marcada como <strong>aguardando cliente</strong>, e no Hub ele vê <strong>Aguardando retorno</strong>. Você é avisado quando ele responder.</div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px;">
      <button class="btn btn-primary" id="lab-resp-btn" disabled style="opacity:0.5;cursor:not-allowed;" onclick="labResponder()"><i data-lucide="send" class="w-4 h-4"></i><span id="lab-resp-label">${_lab.espera ? 'Enviar e colocar em espera' : 'Enviar'}</span></button>
    </div>`;
}

function labConversaAbrir() {
  const t = _lab.t;
  const msgs = labMsgs(t);
  labDrawerAbrir({
    titulo: 'Conversa com o cliente',
    sub: `${t.clientName || ''} · ${t.senderName || ''}`,
    corpo: msgs.length
      ? `<div class="history-list">${msgs.map((m) => renderHistoryMessage(Object.assign({}, m, { timestamp: labQuandoExato(t, m.timestamp) }), t)).join('')}</div>`
      : `<div class="lab-vazio">Nenhuma mensagem trocada com o cliente nesta tarefa.</div>`,
    rodape: labConversaRodape(t),
    fim: true, // a última mensagem é o que importa — ver labDrawerAoFim
  });
