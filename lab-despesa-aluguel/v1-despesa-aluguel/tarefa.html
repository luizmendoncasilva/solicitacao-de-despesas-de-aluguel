function labChegouMensagemCliente() {
  const t = _lab.t;
  if (!t) return;
  if (labTipo(t) !== 'cliente') { flash('Esta tarefa é do robô — não existe conversa com cliente aqui.', 'warning'); return; }
  if (t.status === 'completed' || t.status === 'cancelled') {
    flash('A tarefa está encerrada — no Hub o cliente não consegue mais responder nesta solicitação.', 'warning');
    return;
  }
  const msg = LAB_MSG_CLIENTE[_lab.msgIdx++ % LAB_MSG_CLIENTE.length];
  const arqs = (msg.arquivos || []).slice();
  // labMsgs, não t.messages: em espera a conversa pode vir do fallback do núcleo, e
  // concatenar sobre t.messages jogaria fora o que a tela está mostrando.
  const quando = labAgora();
  t.messages = labMsgs(t).concat([{ from: 'client', text: msg.texto, timestamp: quando, attachments: arqs }]);
  t.respondedAt = quando;
  // Arquivo que chega na conversa também entra na pilha "Anexos enviados pelo cliente" — regra do
  // núcleo (04-comunicacao-cliente.md § Anexos em mensagens). Fica nos dois lugares de propósito:
  // dentro da mensagem que o trouxe, e na lista de quem procura "todos os arquivos da tarefa".
  if (arqs.length) t.attachments = (t.attachments || []).concat(arqs);
  // Em espera, a resposta do cliente libera a tarja — é a regra que a tela já tem.
  if (t.status === 'stationed') t.clientResponded = true;

  // Já está com a conversa aberta? Então não há o que sinalizar: a mensagem entra na frente
  // dele. Bolinha é pra quem não viu.
  const vendo = _lab.drawerQual === 'conversa';
  if (!vendo) t.labClienteRespondeu = true;
  state.notifications.unshift({
    id: Date.now(), labMsg: true, unread: !vendo,
    text: `${t.clientName || 'Cliente'} respondeu na solicitação de ${t.type || 'DP'}`,
    time: quando,
  });
  renderNotifications();
  labRender();
  if (vendo) labConversaAbrir(); // redesenha o painel com a mensagem nova
}

/* ---------- histórico da tarefa = A TIMELINE DO HUB ---------- */
const LAB_HUB_STATUS = {
  andamento:   { rotulo: 'Em andamento',        cor: '#2463eb',               fundo: 'var(--brand-blue-soft)', borda: '#2463eb' },
  processamento: { rotulo: 'Em processamento',  cor: '#2463eb',               fundo: 'var(--brand-blue-soft)', borda: '#2463eb' },
  aguardando:  { rotulo: 'Aguardando retorno',  cor: 'var(--warning)',        fundo: 'var(--warning-soft)',    borda: '#f59e0b' },
  concluida:   { rotulo: 'Concluída',           cor: '#17a349',               fundo: 'var(--success-soft)',    borda: '#17a349' },
  cancelada:   { rotulo: 'Cancelada',           cor: 'var(--danger)',         fundo: '#fef2f2',                borda: 'var(--danger)' },
};
const LAB_MESES_ABREV = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
// "14 de mai às 10:35" — o formato do Hub. Deriva de createdDaysAgo/MOCK_TODAY, a mesma
// fonte de data que o resto da tela usa (_dmyFromDaysAgo do núcleo).
function labDataHub(diasAtras, hora) {
  const dmy = _dmyFromDaysAgo(diasAtras || 0).split('/');
  const mes = LAB_MESES_ABREV[Number(dmy[1]) - 1] || dmy[1];
  return `${Number(dmy[0])} de ${mes}${hora ? ` às ${hora}` : ''}`;
}
function _labHora(txt) { const m = String(txt || '').match(/\d{1,2}:\d{2}/); return m ? m[0] : ''; }
// Quantos dias atrás um timestamp de mock aconteceu, na régua do MOCK_TODAY. Sem pista de dia,
// vale o dia em que a solicitação entrou — é a mesma leitura de labQuandoExato.
function labDiasDo(t, txt) {
  const bruto = String(txt || '').trim();
  const padrao = t.createdDaysAgo || 0;
  if (!bruto) return padrao;
  const abs = bruto.match(/(\d{1,2})\/(\d{1,2})\/(\d{2})/);
  if (abs) {
    const hoje = new Date(MOCK_TODAY.ano, MOCK_TODAY.mes - 1, MOCK_TODAY.dia);
    const quando = new Date(2000 + Number(abs[3]), Number(abs[2]) - 1, Number(abs[1]));
    return Math.max(0, Math.round((hoje - quando) / 86400000));
  }
  if (/^agora|hoje/i.test(bruto)) return 0;
  if (/ontem/i.test(bruto)) return 1;
  const m = /h[áa]\s*(\d+)\s*d/i.exec(bruto);
  return m ? Number(m[1]) : padrao;
}

function labAgora() {
  const d = new Date();
  return `${_dmyFromDaysAgo(0)} ${_pad2(d.getHours())}:${_pad2(d.getMinutes())}`;
}
// Dentro do passo a régua é outra e já existia: "14/05 · 10:41" (labHoraPasso e os eventos
// declarados no mock). Comentário escrito agora entra no formato dos vizinhos, não no da conversa.
function labAgoraPasso() {
  const d = new Date();
  return `${_dmyFromDaysAgo(0).slice(0, 5)} · ${_pad2(d.getHours())}:${_pad2(d.getMinutes())}`;
}
function labQuandoExato(t, txt) {
  const bruto = String(txt || '').trim();
  if (!bruto) return '';
  if (/\d{1,2}\/\d{1,2}\/\d{2}/.test(bruto)) return bruto; // mock já exato
  if (/^agora/i.test(bruto)) return labAgora();
  const hora = _labHora(bruto) || t.receivedAt || '';
  let dias = t.createdDaysAgo || 0; // sem pista de dia, vale o dia em que a solicitação entrou
  if (/hoje/i.test(bruto)) dias = 0;
  else if (/ontem/i.test(bruto)) dias = 1;
  else { const m = /h[áa]\s*(\d+)\s*d/i.exec(bruto); if (m) dias = Number(m[1]); }
  return `${_dmyFromDaysAgo(dias)}${hora ? ` ${hora}` : ''}`;
}

const LAB_ATRIB_POR = {
  'T-2107': 'o2', // a tarefa da Beatriz veio de uma atribuição do Lucas, não da fila

function labSemearAtribuicao(t) {
  if (t.labInternos) return;

}
function labAtribuicoes(t) { return t.labInternos || []; }
// Registra uma mudança de mão feita agora, na hora do relógio de verdade.

/* Os acontecimentos saem dos campos que a tarefa já tem — nada de dado novo inventado:
   receivedAt/createdDaysAgo · operatorId · stationedAt/stationedReason · clientResponded ·
   status/timelineStep · finishedAt · cancelledAt/cancelReason · messages.
   Onde o mock não guarda hora própria (entrar em análise, entrar em processamento), o
   evento herda a hora do vizinho conhecido — é mock, e as horas do resto da tela também
   são derivadas assim. */
/* Robô e HITL não têm cliente do outro lado: o painel deixa de ser a vista do Hub e passa a ser
   o registro interno da tarefa. Só a vida dela — nascimento, trocas de mão e desfecho; o
   travamento do robô já aparece no passo que falhou, no roteiro, atrás do painel. */
function labHistoricoAP(t) {
  const ev = [];
  const dia = t.createdDaysAgo || 0;
  const passos = labRoteiro(t) || [];
  const horaDoPasso = (p) => {
    if (!p) return '';
    const evs = labEventos(t, p);
    return _labHora(p.quando) || _labHora((evs[evs.length - 1] || {}).quando);
  };

  if (labTipo(t) === 'robo') {
    // O relógio do painel é o do roteiro, não o do cabeçalho: os dois divergem nos mocks.
    ev.push({ dia, hora: _labHora(_apTime(0)) || t.receivedAt || '', icone: 'sparkles', tom: 'escuro', titulo: 'Execução iniciada pelo Autopilot' });
  } else {
    ev.push({ dia, hora: t.receivedAt || '', icone: 'sparkles', tom: 'escuro', titulo: 'Tarefa gerada pelo Autopilot', link: t.apExecucao || null });
    labAtribuicoes(t).forEach((a) => ev.push({ dia: a.dia, hora: a.hora, interno: true, texto: a.texto }));
    if (t.status === 'completed') {
      const atu = labUltimaAtuacao(t);
      ev.push({ dia, hora: horaDoPasso(passos[0]), icone: 'activity', tom: 'azul', titulo: 'Resolvida e devolvida ao Autopilot', nota: atu && atu.nome ? `Por ${atu.nome.split(' · ')[0]}` : '' });
    }
  }
  if (t.status === 'completed') ev.push({ dia: t.finishedDaysAgo || 0, hora: _labHora(t.finishedAt), icone: 'check', tom: 'verde', titulo: 'Concluída' });

  let ultima = ev[0] ? ev[0].hora : '';
  ev.forEach((e) => { if (!e.hora) e.hora = ultima; else ultima = e.hora; });
  return ev;
}

function labHistoricoEventos(t) {
  if (labTipo(t) !== 'cliente') return labHistoricoAP(t);
  const ev = [];
  const diaIn = t.createdDaysAgo || 0;
  const horaIn = t.receivedAt || '';
  ev.push({ dia: diaIn, hora: horaIn, icone: 'sparkles', tom: 'escuro', titulo: 'Solicitação criada' });

  // "Em andamento" NASCE DA ATRIBUIÇÃO: enquanto a solicitação está na fila sem dono, o cliente
  // só vê que ela foi criada. É por isso que não existe um evento de "Aberto" — sair da fila é o
  // primeiro status que ele recebe.
  const atrib = labAtribuicoes(t);
  // Devolver à fila não apaga o "Em andamento" que o cliente já leu — por isso o registro de
  // atribuição também conta, e a hora do status é a da atribuição, não a da criação.
  const atribuida = t.status !== 'queue' || atrib.length > 0;
  if (atribuida) ev.push({ dia: atrib[0] ? atrib[0].dia : diaIn, hora: atrib[0] ? atrib[0].hora : horaIn, icone: 'activity', tom: 'azul', status: 'andamento' });

  // Quem pegou (ou recebeu) a tarefa, junto do status que essa ação gerou.
  atrib.forEach((a) => ev.push({ dia: a.dia, hora: a.hora, interno: true, texto: a.texto }));

  // Mensagens entram na ordem em que foram trocadas, entre os status.
  const msgs = labMsgs(t);
  msgs.forEach((m) => {
    const doCliente = m.from === 'client';
    ev.push({
      dia: labDiasDo(t, m.timestamp),
      hora: _labHora(m.timestamp) || horaIn,
      icone: 'message-square', tom: doCliente ? 'claro' : 'escuro',
      quem: doCliente ? (t.senderName || 'Cliente') : 'BHub',
      escopo: doCliente ? 'Cliente' : 'Escritório',
      texto: m.text || '',
    });
  });

  if (t.status === 'stationed') {
    ev.push({ dia: diaIn, hora: _labHora(t.stationedAt) || horaIn, icone: 'activity', tom: 'ambar', status: 'aguardando', nota: t.stationedReason || '' });
    if (t.clientResponded) ev.push({ dia: 0, hora: _labHora(t.respondedAt) || '', icone: 'activity', tom: 'azul', status: 'andamento' });
  }
  if (t.status === 'processing' || t.timelineStep === 2 || t.status === 'completed') {
    ev.push({ dia: t.status === 'completed' ? (t.finishedDaysAgo || 0) : 0, hora: '', icone: 'activity', tom: 'azul', status: 'processamento' });
  }
  if (t.status === 'completed') ev.push({ dia: t.finishedDaysAgo || 0, hora: _labHora(t.finishedAt), icone: 'check', tom: 'verde', status: 'concluida' });
  // Cancelada usa o X DENTRO DE CÍRCULO, não o X solto: é o ícone do Hub. O caso de tarefa
  // cancelada está fora do catálogo do lab, mas o evento já sai certo quando ele voltar.
  if (t.status === 'cancelled') ev.push({ dia: t.cancelledDaysAgo || 0, hora: _labHora(t.cancelledAt), icone: 'circle-x', tom: 'vermelho', status: 'cancelada', nota: t.cancelReason || '' });

  // Ordem = cronológica de verdade, não a ordem em que eu empilhei: um mock com mensagem
  // depois da espera sairia fora de ordem. Evento sem hora herda a do anterior.
  let ultima = horaIn;
  ev.forEach((e) => { if (!e.hora) e.hora = ultima; else ultima = e.hora; });
  return ev
    .map((e, k) => ({ e, k }))
    .sort((a, z) => ((z.e.dia - a.e.dia) || a.e.hora.localeCompare(z.e.hora) || (a.k - z.k)))
    .map((x) => x.e);
}

function labResponder() {
  const ta = document.getElementById('lab-resp-input');
  const txt = ta ? ta.value.trim() : '';
  if (!txt) return;
  const t = _lab.t;
  const arqs = (_lab.respAnexos || []).slice();
  // labMsgs, não t.messages: em espera a conversa pode vir do fallback do núcleo, e concatenar
  // sobre t.messages apagaria da tela o que a pessoa acabou de ler.
  t.messages = labMsgs(t).concat([{ from: 'operator', text: txt, timestamp: labAgora(), attachments: arqs }]);
  _lab.respAnexos = [];

  // Só coloca em espera se a opção estiver marcada — e só se ainda não estiver.
  const vaiEsperar = _lab.espera && !labEmEspera(t) && labPosse(t) === 'minha';
  if (vaiEsperar) {
    // A fase é PRESERVADA: guarda onde a tarefa está antes de trocar o status, senão a régua
    // andaria pra trás (ver labFases). Motivo da espera = a mensagem, cortada em 80 — a
    // mesma regra do enviarPendenciaCliente do núcleo.
    t.timelineStep = labNoProcessamento(t) ? 2 : 1;
    t.status = 'stationed';
    t.stationedAt = labAgora();
    t.stationedReason = txt.length > 80 ? txt.substring(0, 80) + '…' : txt;
    t.clientResponded = false;
  }
  labConversaFechar();
  labRender();
  const comArqs = arqs.length ? ` com ${arqs.length} arquivo${arqs.length > 1 ? 's' : ''}` : '';
  flash(vaiEsperar
    ? `Mensagem${comArqs} enviada — a tarefa ficou em espera aguardando o cliente.`
    : `Mensagem${comArqs} enviada ao cliente.`, 'success');
}

  });
}
function labDevolverFila() {
  const t = _lab.t;
  const minha = t.operatorId === LAB_EU;
  showConfirmModal({
    title: 'Devolver à fila?',
    message: minha
      ? 'A tarefa volta para a fila geral, sem dono, e outro operador pode pegá-la. O que você já marcou como feito continua registrado.'
      : 'A tarefa sai de quem está com ela agora e volta para a fila geral, sem dono. O que já foi marcado como feito continua registrado.',
    confirmLabel: 'Devolver à fila', cancelLabel: 'Cancelar', danger: true,
    onConfirm: () => {
      // Quem devolve é sempre quem está navegando, mesmo quando a tarefa era de um colega — e é
      // justamente nesse caso que o registro importa: some da mão dela sem ela ter feito nada.
      const dela = !minha ? ((acOp(t.operatorId) || {}).nome || '') : '';
      t.operatorId = null;
      t.status = 'queue';
      labRegistraAtribuicao(dela
        ? `${OPERATOR_NAME} devolveu à fila a tarefa de ${dela}`
        : `${OPERATOR_NAME} devolveu a tarefa à fila`);
      labRender();
      flash('Tarefa devolvida à fila.', 'success');
    },
  });
}
function labVoltarValidacao(opts) {
  const t = _lab.t;
  const editar = !!(opts && opts.editar);
  showConfirmModal({
    title: 'Voltar aos dados da solicitação?',
    message: 'A tarefa volta para a etapa de <strong>Dados da solicitação</strong>, o status muda para <strong>Em andamento</strong> (o cliente também vê) e os passos de <strong>Processamento</strong> já marcados serão desmarcados — você refaz ao reavançar.',
    confirmLabel: editar ? 'Voltar e editar' : 'Voltar aos dados', cancelLabel: 'Cancelar',
    // Zera a visita: a etapa dos dados virou a fase CORRENTE, então não há mais "estou olhando
    // o passado" — se ficasse, a tela diria que a tarefa está em outro lugar.
    onConfirm: () => {
      t.status = 'active'; t.timelineStep = 1; t.labDone = 0; _lab.vendo = null;
      labRender();
      if (editar) enterEditMode();
      flash('Tarefa voltou aos dados da solicitação — agora os campos podem ser editados.', 'success');
    },
  });
}
// Contraparte de labVoltarValidacao: avança a etapa. Mesmo efeito do aceitarTarefa()
// do núcleo (timelineStep = 2 → o cliente vê "Em processamento"). Não pede confirmação
// porque é o caminho esperado — quem REGRIDE é que confirma.
function labAceitarTarefa() {
  const t = _lab.t;
  t.status = 'processing';
  t.timelineStep = 2;
  _lab.vendo = null; // a fase mudou: qualquer visita em curso perdeu sentido
  labRender();
  flash('Tarefa em processamento.', 'success');
}
// labDone conta os passos DO PROCESSO — não o passo de validação, que já veio feito.
// Por isso a conta é sobre labPassosDoProcesso, não sobre o roteiro renderizado.
function labMarcarFeito(i) {
  const t = _lab.t;
  const p = (labRoteiro(t) || [])[i];
  if (labMsgFinalPendente(t, p)) { labMsgFinalCobrar(); return; }
  const total = labPassosDP(t).length;
  const proximo = Math.min((t.labDone || 0) + 1, total);
  if (proximo >= total) { labFinalizarAbrir(); return; }
  t.labDone = proximo;
  labRender();
}

function labFinalizarAbrir() {
  const t = _lab.t;
  const alvo = document.getElementById('modal-confirm-finish');
  if (!alvo) { labFinalizarConfirmar(); return; } // sem o modal do núcleo, não trava o fluxo
  const det = document.getElementById('confirm-finish-detail');
  if (det) {
    const n = labMsgFinalArqs(t).length;
    const arquivos = n ? `${n} arquivo${n > 1 ? 's' : ''}` : 'nenhum arquivo';
    det.innerHTML = `A mensagem que você escreveu e <strong>${arquivos}</strong> vão para <strong>${esc(t.clientName)}</strong> no HUB, na solicitação de ${esc(t.type)}.`;
  }
  alvo.classList.remove('hidden');
  refreshIcons();
}
function labFinalizarFechar() {
  const alvo = document.getElementById('modal-confirm-finish');
  if (alvo) alvo.classList.add('hidden');
}
function labFinalizarConfirmar() {
  const t = _lab.t;
  /* REDE DA MENSAGEM OBRIGATÓRIA: o caminho normal já barra em labMarcarFeito, mas o modal do núcleo
     pode ser aberto por outra porta — e confirmar aqui é o que notifica o cliente. */
  const roteiro = labRoteiro(t) || [];
  const passoFinal = roteiro.filter((p) => (p.blocos || []).some((b) => b.tipo === 'mensagem-final')).pop();
  if (labMsgFinalPendente(t, passoFinal)) { labFinalizarFechar(); labMsgFinalCobrar(); return; }
  t.labDone = labPassosDP(t).length;
  t.status = 'completed';
  t.finishedDaysAgo = 0;
  t.finishedAt = labAgora();
  labFinalizarFechar();
  labRender();
  flash('Solicitação concluída — o cliente foi notificado.', 'success');
}
// Os botões do modal do núcleo chamam estas duas funções; no lab elas terminam em labRender em vez
// de trocar de tela (a `screen-success` não existe aqui — o fim do roteiro faz esse papel).
window.confirmarFinalizacao = labFinalizarConfirmar;
window.closeConfirmFinish = labFinalizarFechar;

function labAcaoPasso(i) {
  const t = _lab.t;
  if (!labPodeAgir(t)) return;
  const p = (labRoteiro(t) || [])[i];
  if (!p || !p.acao) return;
  const jaFeito = labEstadoVisual(t, p) === 'done';
  if (jaFeito) { flash(`${p.acao.label} — repetido.`, 'info'); return; }
  if (p.autoConclui) { flash(`${p.acao.label} — concluído.`, 'success'); labMarcarFeito(i); return; }
  flash(`${p.acao.label} — ação registrada. Marque como feito quando concluído.`, 'info');
  labRender();
}

/* Passo FEITO que tem corpo recolhe, como no projeto: o cabeçalho vira clicável, ganha um chevron
   e o conteúdo só aparece quando se pede. Sem isso, uma tarefa concluída abria com os quatro
   corpos empilhados abertos e a régua do que foi feito virava um paredão. */
function labPassoToggle(i) {
  _lab.expandido[i] = !_lab.expandido[i];
  labRender();
}

// Cross-link execução ⇄ pendência: no lab, navega entre TELAS (não entre modais). O modo de
// leitura acompanha: quem está espiando continua espiando do outro lado.
function acNavModal(id) { location.href = 'tarefa.html?id=' + encodeURIComponent(id); }

/* ---------- montagem ----------
   A tela ABRE NA ETAPA EM QUE A TAREFA ESTÁ. O chassi (cabeçalho + fases) é sempre o
   mesmo; o miolo é o da fase corrente: Dados da solicitação mostra os dados a conferir,
   Processamento mostra o roteiro de passos. O Autopilot não tem etapa de conferência
   do operador — cai direto no roteiro, como sempre foi. */
function labMiolo(t) {
  if (t.status === 'cancelled') return labExecucao(t); // cancelada: sem passos, só a conversa
  const tipo = labTipo(t);
  if (tipo === 'robo') return labExecucao(t);          // tarefa do robô: o roteiro, como sempre
  if (tipo === 'hitl') return labMioloHITL(t);         // HITL: as telas de resolução do Autopilot
  return labEmValidacao(t) ? labValidacao(t) : labExecucao(t);
}

function labRender() {
  const host = document.getElementById('screens-container');
  const t = _lab.t;
  // A aba aberta é estado da TELA, não da tarefa: a tela se redesenha inteira a cada ação, e sem
  // guardar isso qualquer clique jogaria a pessoa de volta pra primeira aba.
  const abaAtual = (typeof _getActiveFormTabId === 'function') ? _getActiveFormTabId() : null;
  if (abaAtual) _lab.aba = abaAtual;
  host.innerHTML = `<div class="container-wide" style="min-width:840px;">
    ${labHeader(t)}
    ${t.status === 'cancelled' ? '' : `<div class="section-card" style="padding:20px 28px;"><div class="timeline-horizontal">${labStepperHTML(t)}</div></div>`}
    ${labMiolo(t)}
  </div>`;
  labPintaForm(t);
  refreshIcons();
  // O painel de eventos vive fora do #screens-container, então o redesenho da tela não passa por
  // ele. Comentar muda os dois ao mesmo tempo: a contagem no botão e a lista dentro do painel.
  if (_lab.drawerQual === 'eventos') labEventosRedesenhar();
}

function labMount() {
  const host = document.getElementById('screens-container');
  if (!host) { setTimeout(labMount, 40); return; }
  const t = AC_TAREFAS.find((x) => x.id === labId());
  if (!t) {
    host.innerHTML = `<div class="container-wide"><div class="section-card">
      <div class="section-title"><i data-lucide="search-x"></i>Tarefa não encontrada</div>
      <p class="lab-vazio">Nenhuma tarefa com o id <strong>${esc(labId() || '—')}</strong>. Abra uma tarefa a partir do painel.</p>
      <div style="margin-top:16px;"><a class="btn btn-primary" href="${labVoltarHref()}" style="text-decoration:none;"><i data-lucide="arrow-left" class="w-4 h-4"></i>Ir para o painel</a></div>
    </div></div>`;
    refreshIcons(); return;
  }
  _lab.t = t;
  /* O núcleo procura a tarefa corrente por `state.currentTaskId` (getTaskById). As tarefas do lab
     vivem em AC_TAREFAS, fora das listas do state — apontar `state.active` pra ela é o que faz
     `renderForm`, `enterEditMode`, `saveEdits` e `showEditLog` funcionarem aqui sem cópia. */
  state.active = t;
  state.currentTaskId = t.id;
  // O passo de mensagem e entrega guarda os arquivos aqui (chave do núcleo, ver labMsgFinalArqs).
  if (!state._gdocsFiles) state._gdocsFiles = {};
  if (!state._gdocsFiles[t.id]) state._gdocsFiles[t.id] = [];
  labSemearMsgFinal(t);
  labSemearLog(t);
  labSemearAtribuicao(t);
  labRoteiro(t).forEach((p, i) => { if (p.nasceAberto) _lab.expandido[i] = true; });
  labRender();
  // Selo do canto: diz em que versão você está e volta pro índice das versões.
  document.body.insertAdjacentHTML('beforeend', `<a class="lab-flag" href="../index.html" title="Ver todas as versões">laboratório · despesa de aluguel · ${LAB_VERSAO_LABEL}</a>`);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && _lab.drawer) labDrawerFechar();
});
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', labMount); else labMount();
</script>
</body>
</html>
