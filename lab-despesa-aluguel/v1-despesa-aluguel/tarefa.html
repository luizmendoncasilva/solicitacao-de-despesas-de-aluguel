<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>Despesa de aluguel · laboratório · Cockpit</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../operador-ui.css" />
<style>
  /* ── O que é novo nesta tela (o resto vem do núcleo + operador-ui.css) ───────
     1. .exec-step.failed — estado NOVO do passo: falhou. Espelha o .exec-step.done
        trocando o verde pelo --danger (mesmo padrão, cor do erro).
     2. .step-ev-btn / .step-alerta — a linha de baixo do passo: o botão que abre os eventos
        no painel lateral (mesmo objeto dos de Histórico e Conversa), com a contagem, o balão
        de comentários e o alerta de falha. Ao lado dele, .step-hist/.step-chev: a seta que
        abre o CORPO do passo, disclosure puro e sem caixa.
     3. .step-status / .step-when — a coluna da direita: tag e, sob ela, o horário.
     4. .lab-try-lista — a lista de eventos (e seus comentários), dentro do painel lateral.
     5. .lab-fim — a divisória com selo que fecha o roteiro de um processo concluído.
     6. .lab-drawer — o painel lateral: Conversa, Histórico e eventos do passo.
     7. .lab-grupo — título de macroetapa dentro do roteiro (só o Autopilot agrupa). */

  .exec-step.failed { border-color: var(--danger); background: linear-gradient(to right, #fef2f2, #fff); }
  .exec-step.failed .step-num { background: var(--danger); color: #fff; }
  .exec-step .step-espera { font-size: 11px; color: var(--text-tertiary); }
  .exec-step .step-num svg { width: 15px; height: 15px; stroke-width: 2.75; }
  .exec-step .step-num.pend::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary); opacity: 0.6; }
  .exec-step.active .step-num.pend::after { background: #fff; opacity: 1; }

  .lab-grupo { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); margin: 18px 0 8px; }
  .lab-grupo:first-child { margin-top: 0; }

  /* Corpo do passo: uma peça embaixo da outra, com respiro. */
  .exec-step .step-corpo { display: flex; flex-direction: column; gap: 14px; }

  .lab-try-lista { display: flex; flex-direction: column; gap: 20px; }
  .lab-try { display: flex; gap: 9px; align-items: flex-start; }
  .lab-try > i, .lab-try > svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 2px; stroke-width: 2.25; }
  .lab-try.ok > i, .lab-try.ok > svg { color: var(--success); stroke: var(--success); }
  .lab-try.erro > i, .lab-try.erro > svg { color: var(--danger); stroke: var(--danger); }
  .lab-titulo-hora { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .lab-try-text { font-size: 13.5px; color: var(--text-primary); line-height: 1.4; }
  .lab-try-when { font-size: 11.5px; color: var(--text-tertiary); }
  .lab-try-quem { font-size: 11.5px; color: var(--text-tertiary); margin-top: 6px; }
  .ta-err { margin-top: 8px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 9px; padding: 10px 12px; }
  .ta-err-text { font-size: 12.5px; color: var(--text-primary); line-height: 1.55; }

  .exec-step .step-side { display: flex; flex-direction: column; align-items: flex-end; align-self: stretch; gap: 9px; flex-shrink: 0; }
  /* min-height: sem ela, passo com aviso fica 3px mais alto que passo sem — e a lista
     inteira perde o ritmo por causa do ícone do chip. */
  .exec-step .step-hist-row { display: flex; align-items: center; gap: 9px; min-height: 20px; }
  .exec-step .step-chev-row { display: flex; justify-content: flex-end; margin-top: auto; }
  .step-sep { width: 1px; height: 13px; background: var(--border-strong); flex-shrink: 0; }
  .exec-step .step-hist { display: inline-flex; align-items: center; gap: 6px; padding: 0; background: none; border: none; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
  .exec-step .step-hist:hover { color: var(--brand-blue); }
  .exec-step .step-hist.open { color: var(--brand-blue); }
  .exec-step .step-hist .ex-chev { transition: transform .18s; flex-shrink: 0; }
  .exec-step .step-hist.open .ex-chev { transform: rotate(180deg); }
  .step-ev-btn { padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .step-ev-btn .step-ev-cmt { display: inline-flex; align-items: center; gap: 3px; color: var(--text-tertiary); font-weight: 500; }
  .step-ev-btn .step-ev-cmt svg { width: 13px; height: 13px; }
  /* PASSO TRAVADO: o botão inteiro fica vermelho. Até 13/08 a lista de eventos nascia aberta no
     passo travado, porque a causa da parada é o que a pessoa abriu a tarefa pra ler. Com os
     eventos no painel, nada abre sozinho (decisão do Rodrigo) — então o que chama é o botão. */
  .step-ev-btn.viva { border-color: var(--danger); color: var(--danger); }
  .step-ev-btn.viva:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }
  .step-alerta { display: inline-flex; align-items: center; margin-right: -1px; }
  .step-alerta svg { width: 14px; height: 14px; flex-shrink: 0; }
  .step-alerta.viva svg { color: var(--danger); stroke: var(--danger); }
  .step-alerta.velha svg { color: #d97706; stroke: #d97706; }
  /* Comentar = balão com "+", dentro de cada evento (nunca no passo). Sem prefixo de `.exec-step`
     desde 13/08: o evento mudou de casa e agora mora no painel lateral. */
  .step-cmt { display: inline-flex; align-items: center; justify-content: center; padding: 0; background: none; border: none; color: var(--text-tertiary); cursor: pointer; }
  .step-cmt svg { width: 16px; height: 16px; }
  .step-cmt:hover { color: var(--brand-pink); }

  /* Linha 1 da direita: o horário à ESQUERDA da tag de estado. min-height porque "Em
     andamento" e "Aguardando" são texto puro e ficariam mais baixos que a badge "Feito",
     deixando o passo ativo desalinhado dos outros. */
  .exec-step .step-status { display: flex; align-items: center; gap: 10px; flex-shrink: 0; min-height: 22px; }
  .exec-step .step-when { font-size: 11.5px; color: var(--text-tertiary); white-space: nowrap; }

  /* Fim do roteiro: NÃO é um card. Uma divisória atravessa o fim da lista com o selo no
     meio dela — o único elemento do roteiro que não tem caixa, então não se confunde com
     passo nenhum. (A tela de "Tarefa finalizada" centralizada é pra quem ACABOU de
     finalizar; aqui é registro de um processo que já fechou.)
     O contraste vem da COR do texto, não de fundo: verde forte e negrito, porque cinza
     claro sobre branco desaparece no monitor do operador. */
  .lab-fim { margin-top: 22px; text-align: center; }
  .lab-fim-linha { display: flex; align-items: center; gap: 16px; }
  .lab-fim-linha::before, .lab-fim-linha::after { content: ''; flex: 1; height: 1px; background: var(--border-strong); }
  .lab-fim-selo { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; color: var(--success); white-space: nowrap; }
  .lab-fim-selo svg { width: 18px; height: 18px; stroke: var(--success); stroke-width: 2.25; flex-shrink: 0; }
  .lab-fim-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 7px; }
  /* Arquivos e destino dentro do passo. O rótulo é o MESMO dos dados da solicitação (11px,
     caixa alta, tercário) pra não nascer um terceiro jeito de intitular bloco. Os chips são
     os .material-chip do núcleo, sem variante nova. */
  .lab-bl-label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-bottom: 10px; }
  .lab-arqs { display: flex; flex-wrap: wrap; gap: 8px; }
  /* A pasta usa o .material-chip dos arquivos. Só duas diferenças: é clicável inteira e o
     ícone tem o peso do texto (a pasta é o destino do passo, não um anexo qualquer). */
  .lab-chip-pasta { cursor: pointer; }
  .lab-chip-pasta > svg { color: var(--text-secondary); stroke: var(--text-secondary); }
  .lab-chip-pasta .material-chip-name { font-weight: 600; }
  /* Fala de gente (comentário) — avatar + nome + texto, sem caixa. O avatar carrega o "isto
     é alguém falando"; a caixa em volta era peso sem função. */
  .lab-av { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #f25461, #f97316); color: #fff; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; letter-spacing: 0.02em; }
  .lab-fala { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
  .lab-fala:last-child { margin-bottom: 0; }
  .lab-fala-who { font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .lab-fala-when { font-size: 10.5px; color: var(--text-tertiary); margin-left: 7px; font-weight: 400; }
  .lab-fala-text { font-size: 12.5px; color: var(--text-primary); line-height: 1.55; margin-top: 2px; }

  /* Campo de comentar COMPACTO: uma linha que cresce, e o botão de enviar só aparece com
     texto. Era um card com rodapé próprio, textarea de 62px e dois botões — peso de
     formulário pra uma anotação de uma frase. */
  .lab-cmt-box { border-top: 1px solid var(--border); padding: 11px 14px; background: var(--surface-subtle); }
  .lab-cmt-form { display: flex; align-items: flex-start; gap: 10px; }
  /* Aviso fixo de que o comentário é interno. Recuo alinha com o texto do campo (avatar 26 +
     gap 10) pra ler como legenda dele, não como item novo. */
  .lab-cmt-hint { display: flex; align-items: center; gap: 7px; margin-top: 5px; padding-left: 36px; font-size: 11px; color: var(--text-tertiary); }
  .lab-cmt-hint svg { width: 12px; height: 12px; flex-shrink: 0; }
  .lab-cmt-form textarea { flex: 1; min-width: 0; box-sizing: border-box; padding: 5px 2px; border: none; background: none; font-family: inherit; font-size: 12.5px; line-height: 1.5; resize: none; outline: none; overflow: hidden; color: var(--text-primary); }
  .lab-cmt-form textarea::placeholder { color: var(--text-tertiary); }
  /* Enviar: nasce escondido e some do fluxo; aparece quando há texto (a classe entra pelo
     labRascunho, sem re-render, pra não perder o foco de quem está digitando). */
  .lab-cmt-form .lab-cmt-send { width: 26px; height: 26px; border-radius: 50%; border: none; background: var(--brand-pink); color: #fff; display: none; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .lab-cmt-form .lab-cmt-send svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 2.5; }
  .lab-cmt-form .lab-cmt-send:hover { background: var(--brand-pink-hover); }
  .lab-cmt-form.com-texto .lab-cmt-send { display: flex; }
  .lab-cmt-clip { display: inline-flex; align-items: center; gap: 5px; padding: 0; border: none; background: none; font-family: inherit; font-size: 11px; color: var(--text-tertiary); cursor: pointer; flex-shrink: 0; }
  .lab-cmt-clip svg { width: 12px; height: 12px; }
  .lab-cmt-clip:hover { color: var(--brand-pink); }
  .lab-cmt-sep { width: 1px; height: 11px; background: var(--border-strong); flex-shrink: 0; }
  .lab-cmt-arqs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-left: 36px; }

  .lab-try-head { display: flex; align-items: flex-start; gap: 10px; }
  .lab-try-cmt { margin-top: 1px; }
  .lab-fala-em-lanc { padding-left: 12px; border-left: 1px solid var(--border-strong); margin-top: 10px; }
  .lab-cmt-box.em-lanc { padding: 0 0 0 12px; margin-top: 10px; border-top: none; border-left: 1px solid var(--border-strong); background: none; }
  /* O CHIP DE ARQUIVO É O `material-chip` DO PROJETO, sem variante — o que faltava era ele poder
     encolher. O componente declara `max-width: 100%`, mas o nome do arquivo é `nowrap` e não trunca,
     então num painel de 460px ele empurrava os botões de ver/baixar pra fora da borda: o chip
     aparecia partido e lia como se fosse outro componente. Aqui o nome corta com "…" e o chip
     inteiro cabe, com a mesma cara que tem no resto do protótipo. */
  .lab-drawer .material-chip { max-width: 100%; }
  .lab-drawer .material-chip-name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* Painel lateral (Conversa · Histórico) — DESLIZA da direita, não empurra o roteiro.
     A animação é de verdade: o fundo aparece e o painel entra da borda. Sem transição ele
     "aparecia" seco e parecia bug de renderização. 240ms é o mesmo tempo dos dois lados
     (abrir e fechar) — o labDrawerFechar espera esse tempo antes de remover do DOM. */
  .lab-drawer-bd { position: fixed; inset: 0; background: rgba(15,15,15,0); z-index: 130; display: flex; justify-content: flex-end; transition: background .24s ease; }
  .lab-drawer-bd.aberto { background: rgba(15,15,15,0.35); }
  .lab-drawer { width: 460px; max-width: 92vw; background: var(--surface); height: 100%; display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(15,15,15,0.18); transform: translateX(100%); transition: transform .24s cubic-bezier(.22,.61,.36,1); }
  .lab-drawer-bd.aberto .lab-drawer { transform: translateX(0); }
  .lab-drawer-head { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; }
  .lab-drawer-title { font-size: 15px; font-weight: 700; }
  .lab-drawer-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .lab-drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .lab-drawer-foot { border-top: 1px solid var(--border); padding: 14px 20px; background: var(--surface-subtle); }
  .lab-drawer-foot textarea { width: 100%; box-sizing: border-box; min-height: 74px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: 10px; font-family: inherit; font-size: 13px; resize: vertical; outline: none; }
  .lab-drawer-nota { font-size: 12px; color: var(--text-tertiary); display: flex; align-items: flex-start; gap: 8px; line-height: 1.5; }
  /* Opção de colocar em espera + a consequência dela, no rodapé da Conversa. */
  .lab-espera-opt { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--text-primary); cursor: pointer; user-select: none; }
  .lab-espera-opt input { width: 15px; height: 15px; accent-color: var(--brand-pink); cursor: pointer; flex-shrink: 0; }
  .lab-espera-aviso { display: flex; align-items: flex-start; gap: 8px; margin-top: 9px; padding: 10px 12px; background: var(--warning-soft); border: 1px solid #f59e0b; border-radius: 9px; font-size: 12px; color: var(--warning); line-height: 1.5; }
  .lab-espera-aviso svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }
  /* Botão de anexar — um desenho só pros dois lugares onde se manda arquivo pro cliente: o
     passo de entrega e o rodapé da Conversa. */
  .lab-anexar-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: #fff; border: 1px solid var(--border-strong); border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text-primary); cursor: pointer; }
  .lab-anexar-btn:hover:not(:disabled) { border-color: var(--brand-blue); color: var(--brand-blue); }
  /* Os dois abridores de painel andam juntos, no pé do módulo do topo e colados na direita:
     Histórico (a ordem das coisas) e depois Conversa (falar sobre elas). */
  .lab-head-acoes { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-left: auto; align-self: flex-end; }
  /* O card do topo se mede a si mesmo — não a janela. O que decide o empilhamento é a largura
     REAL do card, que muda com o zoom do navegador, não só com o tamanho do monitor. */
  .lab-topo { container-type: inline-size; container-name: labtopo; }
  /* Card apertado: Histórico em cima, Conversa embaixo, largura igual pros dois e os ícones
     alinhados numa coluna. O ponto é o mesmo em toda tarefa — não depende do tamanho do nome de
     quem está com ela, que é o que faz a linha de atribuição quebrar em lugares diferentes. */
  @container labtopo (width < 820px) {
    .lab-head-acoes { flex-direction: column; align-items: stretch; }
  }
  .lab-conversa-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; background: #fff; border: 1px solid var(--border-strong); border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--text-primary); cursor: pointer; white-space: nowrap; }
  .lab-conversa-btn:hover { border-color: var(--brand-blue); color: var(--brand-blue); }
  .lab-conversa-btn .lab-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-blue); flex-shrink: 0; }
  .notif-btn .dot.lab-dot-msg, .notif-item .dot.lab-dot-msg { background: var(--brand-blue); }

  /* Timeline do Hub, dentro do painel de Histórico: bolinha + linha + data/hora + conteúdo.
     A linha nasce embaixo da bolinha e vai até o item seguinte; o último item não tem linha. */
  .lab-tl-item { display: flex; gap: 12px; position: relative; padding-bottom: 20px; }
  .lab-tl-item:last-child { padding-bottom: 0; }
  .lab-tl-item:not(:last-child)::before { content: ''; position: absolute; left: 15px; top: 36px; bottom: 2px; width: 1px; background: var(--border-strong); }
  .lab-tl-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 1; }
  .lab-tl-dot svg { width: 15px; height: 15px; stroke-width: 2.25; }
  .lab-tl-dot.escuro { background: #0a0a0a; } .lab-tl-dot.escuro svg { stroke: #fff; }
  .lab-tl-dot.claro { background: #fff; border: 1px solid var(--border-strong); } .lab-tl-dot.claro svg { stroke: var(--text-secondary); }
  .lab-tl-dot.azul { background: #2463eb; } .lab-tl-dot.azul svg { stroke: #fff; }
  .lab-tl-dot.ambar { background: #f59e0b; } .lab-tl-dot.ambar svg { stroke: #fff; }
  .lab-tl-dot.verde { background: #17a349; } .lab-tl-dot.verde svg { stroke: #fff; }
  .lab-tl-dot.vermelho { background: var(--danger); } .lab-tl-dot.vermelho svg { stroke: #fff; }
  /* Balão SÓLIDO só na bolinha escura (escritório) e VAZADO na clara (cliente) — é a diferença
     que o Hub usa pra dizer de que lado veio a mensagem, e ela some se os dois forem preenchidos. */
  .lab-tl-dot.escuro svg.lucide-message-square { fill: #fff; }
  .lab-tl-dot.mini { background: transparent; }
  .lab-tl-dot.mini::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--text-secondary); box-shadow: 0 0 0 3px #fff; }
  .lab-tl-interno { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; line-height: 1.6; }
  .lab-tl-tag { display: inline-block; margin-right: 7px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #5b6472; background: #f5f6f8; border: 1px solid #d7dae0; border-radius: 5px; padding: 1px 6px; vertical-align: 1px; }
  .lab-tl-corpo { flex: 1; min-width: 0; padding-top: 1px; }
  .lab-tl-when { font-size: 11.5px; color: var(--text-tertiary); }
  .lab-tl-titulo { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-top: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lab-tl-quem { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-top: 3px; }
  .lab-tl-escopo { font-size: 12px; font-weight: 400; color: var(--text-tertiary); margin-left: 7px; }
  .lab-tl-chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .lab-tl-nota { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
  .lab-tl-msg { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-top: 8px; font-size: 12.5px; color: var(--text-primary); line-height: 1.55; }

  .lab-tl-nav { cursor: pointer; }
  .tl-item-h.lab-tl-nav:hover .tl-step { color: var(--brand-blue); }
  .lab-tl-olhando .tl-dot { box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--brand-blue); }
  /* O rótulo da etapa fica na cor de sempre: quem carrega a marca é o anel + esta legenda. */
  .tl-item-h.lab-tl-olhando .tl-meta { color: var(--brand-blue); font-weight: 600; }

  .container-wide .tl-dot-active { background: var(--brand-blue); box-shadow: 0 0 0 4px var(--brand-blue-soft); }
  .container-wide .exec-step.active { border-color: var(--brand-blue); box-shadow: 0 0 0 3px var(--brand-blue-soft); }
  .container-wide .exec-step.active .step-num { background: var(--brand-blue); }

  /* .tl-item-h junto no seletor de propósito: o CSS do núcleo entra depois (é injetado em runtime)
     e o `padding: 0 6px` dele zeraria o recuo do topo se a especificidade fosse igual. */
  /* PONTAS DA RÉGUA: bolinha de 12px, menos da metade do dot de etapa (28px) — presença sem peso de
     etapa. Os 8px acima e 16px abaixo somam os mesmos 36px que o dot grande + margem gastam, então
     os rótulos das pontas e das etapas nascem na MESMA linha de base. O centro dela cai em 14px,
     onde passa a régua. */
  .lab-tl-marco .tl-marco-dot { width: 12px; height: 12px; border-radius: 50%; margin: 8px 0 16px; background: var(--border-strong); position: relative; z-index: 1; flex-shrink: 0; }
  .lab-tl-marco .tl-marco-dot.feito { background: var(--success); }
  /* A régua é calculada pro dot de 28px (18px do centro); junto da bolinha pequena isso deixava um

  .container-wide .tl-item-h.lab-tl-marco:not(:last-child)::after { left: calc(50% + 11px); }
  .container-wide .tl-item-h.lab-tl-antes-marco:not(:last-child)::after { right: calc(-50% + 11px); }
  .container-wide .tl-item-h.active:not(:last-child)::after,
  .container-wide .tl-item-h.warn:not(:last-child)::after { background: var(--border); }
  .lab-tl-marco .tl-marco-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); line-height: 1.3; }
  .lab-tl-marco.pending .tl-marco-label { color: var(--text-tertiary); font-weight: 500; }

  .lab-flag { position: fixed; left: 12px; bottom: 12px; z-index: 200; background: #141414; color: #fff; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 10px; border-radius: 6px; opacity: 0.85; text-decoration: none; }
  .lab-flag:hover { opacity: 1; }

  /* O operador-ui.css foi escrito pras telas do Autopilot, onde não existe "solicitação do

  TYPE_METADATA: {}, EXEC_STEPS: 'geral', FORM_TABS_BY_TYPE: {},
  getInitialState() { return { queue: [], stationed: [], completed: [], messages: {}, notifications: [] }; },
  renderFormTab(tabId, abaData) {
    const editando = !!(state._editMode && state._editMode[state.currentTaskId]);
    const secoes = Object.entries(abaData || {});
    if (!secoes.length) return '<div class="lab-vazio">Esta aba não tem campos.</div>';
    const html = secoes.map(([secao, campos]) => {
      if (!campos || typeof campos !== 'object') return '';
      const titulo = secao ? `<div class="subsection-title">${esc(secao)}</div>` : '';
      const corpo = Object.entries(campos).map(([campo, valor]) =>
        editando ? labCampoEditavel(tabId, secao, campo, valor) : roField(esc(campo), esc(valor || '—'))).join('');
      return `${titulo}<div class="field-group" style="margin-bottom:24px;">${corpo}</div>`;
    }).join('');
    return editando ? html : injectCopyButtons(html);
  },
};
// Um campo de cada tipo, escolhido pelo formato do valor — os MESMOS componentes dos fluxos
// reais (efDate/efCurrency/efTextarea/efText), nada de input novo.
function labCampoEditavel(tab, secao, campo, valor) {
  const v = String(valor == null ? '' : valor);
  const args = [esc(campo), v, tab, secao, campo];
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(v)) return efDate.apply(null, args);
  if (/^R\$\s/.test(v)) return efCurrency.apply(null, args);
  if (v.length > 70) return efTextarea.apply(null, args);
  return efText.apply(null, args);
}
